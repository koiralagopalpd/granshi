name: Validate Granshi
on:
  push:
    branches: [main, feature/granshi-admin-improvements, feature/granshi-complete-overhaul]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Worker JavaScript
        run: node --check src/worker.js
      - name: Check inline browser scripts
        run: |
          python - <<'PY'
          import re, pathlib
          for file in [pathlib.Path("public/index.html"), pathlib.Path("public/admin/index.html")]:
              html=file.read_text()
              scripts=re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script>", html, re.I)
              for i, script in enumerate(scripts):
                  if script.strip():
                      out=pathlib.Path("/tmp") / f"{file.stem}-{i}.js"
                      out.write_text(script)
                      print(f"Checking {out}")
                      import subprocess
                      subprocess.run(["node","--check",str(out)],check=True)
          PY
      - name: Apply migrations to a fresh SQLite database
        run: |
          python - <<'PY'
          import sqlite3, pathlib
          db=sqlite3.connect(":memory:")
          db.executescript(pathlib.Path("database/0001_initial.sql").read_text())
          db.executescript(pathlib.Path("database/0002_inbound_email.sql").read_text())
          db.executescript(pathlib.Path("database/0003_schema_compatibility.sql").read_text())
          db.executescript(pathlib.Path("database/0004_discovery_search.sql").read_text())
          tables={r[0] for r in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          assert "messages" in tables and "inbound_email_events" in tables
          cols={r[1] for r in db.execute("PRAGMA table_info(messages)")}
          assert {"reply_text","replied_at"} <= cols
          assert "inbound_email_events" in tables
          assert "page_search_index" in tables
          page_cols={r[1] for r in db.execute("PRAGMA table_info(pages)")}
          assert {"thumbnail_image","thumbnail_title_en","thumbnail_summary_en","thumbnail_focal_x","thumbnail_focal_y"} <= page_cols
          assert db.execute("SELECT COUNT(*) FROM page_search_index").fetchone()[0] == 0
          db.execute("INSERT INTO messages(name,email,body,status,created_at) VALUES('Test','test@example.com','Hello','new','2026-01-01')")
          print("Fresh database migrations passed.")
          PY

      - name: Check migrations against an already initialized D1 database
        run: |
          python - <<'PY'
          import sqlite3, pathlib
          root=pathlib.Path("database")
          db=sqlite3.connect(":memory:")
          # Simulate a live database whose migration ledger is missing:
          # initialize once, keep existing data, then replay the full migration chain.
          db.executescript((root/"0001_initial.sql").read_text())
          db.execute("INSERT INTO pages(slug,title_en,content,updated_at,published) VALUES('existing-page','Existing page','[]','2026-11-13',1)")
          db.execute("INSERT INTO messages(name,email,body,status,created_at,reply_text,replied_at) VALUES('Existing','existing@example.com','Existing message','new','2026-11-13',NULL,NULL)")
          before=(db.execute("SELECT COUNT(*) FROM departments").fetchone()[0],db.execute("SELECT COUNT(*) FROM menus").fetchone()[0])
          for name in ["0001_initial.sql","0002_inbound_email.sql","0003_schema_compatibility.sql","0004_discovery_search.sql"]:
              db.executescript((root/name).read_text())
          after=(db.execute("SELECT COUNT(*) FROM departments").fetchone()[0],db.execute("SELECT COUNT(*) FROM menus").fetchone()[0])
          assert before == after == (8,4), (before,after)
          assert db.execute("SELECT title_en FROM pages WHERE slug='existing-page'").fetchone()[0] == "Existing page"
          assert db.execute("SELECT body FROM messages WHERE email='existing@example.com'").fetchone()[0] == "Existing message"
          assert db.execute("SELECT COUNT(*) FROM page_search_index WHERE page_slug='existing-page'").fetchone()[0] == 1
          assert db.execute("SELECT COUNT(*) FROM inbound_email_events").fetchone()[0] == 0
          print("Existing database replay test passed without duplicate departments, menus or data loss.")
          PY
