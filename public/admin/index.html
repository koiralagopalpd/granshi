<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Granshi Admin</title>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f0f2f7;color:#182338;font-family:system-ui,Arial}
.hidden{display:none!important}
.login{max-width:420px;margin:8vh auto;background:#fff;padding:28px;border-radius:18px;box-shadow:0 15px 50px #16243b18}
input,textarea,select{width:100%;padding:11px 12px;border:1px solid #dfe4ec;border-radius:9px;margin:5px 0 12px;font:inherit}
.btn{background:#172640;color:#fff;border:0;border-radius:9px;padding:10px 14px;font-weight:750;cursor:pointer;font-size:13px}
.gold{background:#d8b46a;color:#182338}.danger{background:#a83333}.muted{color:#68758a;font-size:13px}
.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.side{background:#101a2c;color:#fff;padding:16px 10px;position:sticky;top:0;height:100vh;overflow:auto}
.side h2{padding:4px 10px 12px;font-size:16px;margin:0}
.side button{display:block;width:100%;text-align:left;background:none;color:#dce3ed;border:0;padding:10px;border-radius:8px;cursor:pointer;font:inherit}
.side button.active,.side button:hover{background:#ffffff18;color:#f1d99e}
.main{padding:20px;min-width:0}
.box{background:#fff;border:1px solid #e4e8ef;border-radius:14px;padding:16px 18px;margin-top:12px}
.item{padding:12px;border:1px solid #e5e9ef;border-radius:10px;margin:8px 0;display:flex;justify-content:space-between;gap:10px;align-items:flex-start;background:#fafbfd}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700}
.badge.new{background:#e8f0fe;color:#1a56db}.badge.replied{background:#e8f5e9;color:#2e7d32}
.badge.published{background:#e8f5e9;color:#2e7d32}.badge.draft{background:#f3f4f6;color:#6b7280}
.notice{background:#fff5df;padding:10px 12px;border-radius:10px;color:#775820;font-size:13px;margin:8px 0}
.reply-box{display:none;margin-top:10px;padding:12px;background:#f7f8fb;border-radius:10px;border:1px solid #e5e9ef}
.reply-box.open{display:block}
.builder{display:grid;grid-template-columns:1fr 240px;gap:14px;margin-top:12px}
.canvas{min-height:160px;background:#f7f8fb;border:2px dashed #d0d7e4;border-radius:12px;padding:10px}
.block{background:#fff;border:1px solid #dfe4ec;border-radius:10px;padding:10px;margin:8px 0;position:relative}
.block .handle{position:absolute;left:6px;top:8px;color:#9aa3b2;cursor:grab}
.block .rm{position:absolute;right:6px;top:6px;border:0;background:#f3f4f6;border-radius:6px;padding:3px 7px;cursor:pointer}
.block .body{margin:0 28px 0 20px}
.palette button{display:block;width:100%;text-align:left;margin:4px 0;padding:8px 10px;border:1px solid #e5e9ef;border-radius:8px;background:#fafbfd;cursor:pointer;font-size:13px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.tabs button{background:#eef1f6;border:0;padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:600}
.tabs button.on{background:#172640;color:#fff}
#app.focus-mode .side{display:none!important}
#app.focus-mode{display:block!important;min-height:100vh;width:100%}
#app.focus-mode .main{display:block!important;position:relative!important;inset:auto!important;z-index:auto!important;overflow:visible!important;min-height:100vh;width:100%;background:#f0f2f7;padding:16px}
#app.focus-mode #view{display:block!important;visibility:visible!important;min-height:200px}
#app.focus-mode #view>.box,#app.focus-mode #view .box{display:block!important;visibility:visible!important}
#exitFocus{display:none;margin:0 0 12px}
#app.focus-mode #exitFocus{display:inline-flex}
#deptHub.workspace-active,#deptEd.workspace-active,#pageEd.workspace-active{position:fixed!important;inset:0!important;z-index:1000!important;display:block!important;overflow:auto!important;background:#f0f2f7!important;padding:16px!important;margin:0!important;border-radius:0!important}
#pageEd .editor-mode-tabs{display:flex;gap:10px;margin:12px 0}
#pageEd .editor-mode-tabs button{flex:1;min-height:46px;font-size:15px}
#pageEd .editor-mode-tabs button.on{outline:3px solid #d8b46a;outline-offset:1px}
#pageEd .editor-panel{background:#fff;border:1px solid #e4e8ef;border-radius:14px;padding:14px;margin:10px 0}
#pageEd .editor-panel[hidden]{display:none!important}
#pageEd .editor-top{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:-14px;background:#f0f2f7;padding:8px 0;z-index:5}
@media(max-width:900px){.shell{grid-template-columns:1fr}.side{height:auto;position:relative;display:flex;overflow:auto;gap:4px}.side h2{display:none}.side button{width:auto;white-space:nowrap}.builder{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="login" class="login">
  <h1>GRANSHI ADMIN</h1>
  <p class="muted">Department-centric control panel</p>
  <div id="setupNote" class="notice hidden">First run: need SETUP_TOKEN secret.</div>
  <label>Email</label><input id="email" type="email">
  <label>Password</label><input id="password" type="password">
  <div id="setupTokenField" class="hidden"><label>Setup Token</label><input id="setupToken" type="password"></div>
  <button class="btn gold" id="loginBtn">Log in</button>
  <p class="muted" id="loginStatus"></p>
</div>

<div id="app" class="shell hidden">
  <aside class="side">
    <h2>GRANSHI</h2>
    <button data-tab="overview" class="active">Overview</button>
    <button data-tab="departments">Departments</button>
    <button data-tab="messages">Messages</button>
    <button data-tab="comments">Comments</button>
    <button data-tab="menus">Menus</button>
    <button data-tab="usefulLinks">Useful Links</button>
    <button data-tab="settings">Settings</button>
    <button data-tab="security">Security</button>
    <button id="logout" style="margin-top:16px;color:#f5a8a8">Log out</button>
  </aside>
  <main class="main">
    <button class="btn" id="exitFocus" type="button">← Back to Admin menu</button>
    <h1 id="tabTitle" style="margin:0 0 8px;font-size:20px">Overview</h1>
    <div id="view"></div>
  </main>
</div>

<script>
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>[...el.querySelectorAll(s)];
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function api(path,opts={}){
  const r=await fetch('/api'+path,{...opts,headers:{'content-type':'application/json',...(opts.headers||{})}});
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.error||d.detail||'Request failed');
  return d;
}
const ROUTE_KEY='granshiAdminRoute',DRAFT_KEY='granshiAdminDraft';
function getRoute(){try{return JSON.parse(sessionStorage.getItem(ROUTE_KEY)||'{}')}catch{return {}}}
function setRoute(p){try{sessionStorage.setItem(ROUTE_KEY,JSON.stringify({...getRoute(),...p}))}catch(_){}}
function saveDraft(){const root=$('#pageEd');if(!root||!root.classList.contains('workspace-active'))return;const o={};$('input[id],textarea[id],select[id]',root).forEach(e=>{if(e.type!=='file')o[e.id]={value:e.value,checked:!!e.checked}});try{sessionStorage.setItem(DRAFT_KEY,JSON.stringify(o))}catch(_){}}
function restoreDraft(){try{const root=$('#pageEd'),o=JSON.parse(sessionStorage.getItem(DRAFT_KEY)||'{}');Object.entries(o).forEach(([id,x])=>{const e=root?.querySelector('#'+CSS.escape(id));if(e){if(e.type==='checkbox')e.checked=x.checked;else if(e.type!=='file')e.value=x.value}})}catch(_){}}
document.addEventListener('input',saveDraft,true);document.addEventListener('change',saveDraft,true);window.addEventListener('beforeunload',saveDraft);
async function boot(){
  try{const st=await api('/setup/status');if(!st.initialized){$('#setupNote').classList.remove('hidden');$('#setupTokenField').classList.remove('hidden');$('#loginBtn').textContent='Create admin'}}catch(_){}
  try{const me=await api('/auth/me');showApp(me.email)}catch{$('#login').classList.remove('hidden')}
}
$('#loginBtn').onclick=async()=>{
  $('#loginStatus').textContent='Working…';
  try{
    if(!$('#setupTokenField').classList.contains('hidden'))
      await api('/setup',{method:'POST',body:JSON.stringify({email:$('#email').value.trim(),password:$('#password').value,setupToken:$('#setupToken').value})});
    else
      await api('/auth/login',{method:'POST',body:JSON.stringify({email:$('#email').value.trim(),password:$('#password').value})});
    showApp($('#email').value.trim());
  }catch(e){$('#loginStatus').textContent=e.message}
};
$('#logout').onclick=async()=>{await api('/auth/logout',{method:'POST'});location.reload()};
$('#exitFocus').onclick=()=>{setRoute({tab:'overview',deptId:null,deptSub:null,editorSlug:null,editorNew:false});tab('overview')};
function showApp(email){
  $('#login').classList.add('hidden');$('#app').classList.remove('hidden');
  $('.side button[data-tab]').forEach(b=>b.onclick=()=>{$('.side button[data-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active');setRoute({tab:b.dataset.tab,deptId:null,deptSub:null,editorSlug:null,editorNew:false});tab(b.dataset.tab)});
  const saved=getRoute();tab(saved.tab||'overview');
}
const titles={overview:'Overview',departments:'Departments & content',messages:'Messages',comments:'Comments / Feedback',menus:'Menus',usefulLinks:'Useful Links',settings:'Settings',security:'Security'};
async function tab(name){
  setRoute({tab:name});
  $('#app').classList.toggle('focus-mode',name!=='overview');
  $('#tabTitle').textContent=titles[name]||name;
  const v=$('#view');v.innerHTML='<div class="box"><p class="muted">Loading…</p></div>';
  try{
    if(name==='overview'){
      const d=await api('/admin/overview');
      v.innerHTML=`<div class="box"><p>Logged in. New messages: <b>${d.new_messages||0}</b> · Departments: <b>${(d.departments||[]).length}</b> · Published pages: <b>${(d.pages||[]).length}</b></p>
        <p class="notice">Open <b>Departments</b> to manage pages, categories and media inside each department.</p></div>`;
    }
    if(name==='departments'){
      await renderDepartments(v);
      const st=getRoute();if(st.deptId)await openDeptHub(Number(st.deptId),st.deptSub||'pages',st.editorSlug||null,!!st.editorNew);
    }
    if(name==='messages') await renderMessages(v);
    if(name==='comments') await renderComments(v);
    if(name==='menus') await renderMenus(v);
    if(name==='usefulLinks') await renderUsefulLinks(v);
    if(name==='settings') await renderSettings(v);
    if(name==='security'){
      v.innerHTML=`<div class="box"><h3>Change password</h3>
        <label>Current</label><input id="oldp" type="password">
        <label>New (12+)</label><input id="newp" type="password">
        <button class="btn gold" id="chp">Change</button></div>`;
      $('#chp').onclick=async()=>{try{await api('/admin/password',{method:'POST',body:JSON.stringify({currentPassword:$('#oldp').value,newPassword:$('#newp').value})});alert('Changed')}catch(e){alert(e.message)}};
    }
  }catch(e){v.innerHTML=`<div class="box">Error: ${esc(e.message)}</div>`}
}


/* ---- Footer useful links ---- */
async function renderUsefulLinks(v){
  const cfg=await api('/admin/overview');
  let links=[];
  try{links=JSON.parse(cfg.settings?.useful_links||'[]');if(!Array.isArray(links))links=[]}catch{links=[]}
  function draw(){
    v.innerHTML=`<div class="box">
      <div class="row" style="justify-content:space-between"><h3>Footer · Useful Links</h3><button class="btn gold" id="ulAdd">+ Add link</button></div>
      <p class="muted">यहाँ थपिएका लिंकहरू वेबसाइटको footer मा देखिन्छन्। Title, छोटो विवरण र पूरा URL राख्नुहोस्।</p>
      <div id="ulRows">${links.map((x,i)=>`
        <div class="box" style="background:#f8f9fc">
          <div class="row" style="justify-content:space-between"><b>Link ${i+1}</b><button class="btn danger" data-uldel="${i}">Remove</button></div>
          <label>Title / नाम</label><input data-ultitle="${i}" value="${esc(x.title||'')}" placeholder="Example: Nepal Government">
          <label>Short description / छोटो विवरण</label><input data-uldesc="${i}" value="${esc(x.description||'')}" placeholder="Official information and services">
          <label>URL (https://...)</label><input data-ulurl="${i}" type="url" value="${esc(x.url||'')}" placeholder="https://example.com">
          <div class="row"><button class="btn" data-ulup="${i}" ${i===0?'disabled':''}>↑ Move</button><button class="btn" data-uldn="${i}" ${i===links.length-1?'disabled':''}>↓ Move</button></div>
        </div>`).join('')||'<p class="muted">अहिलेसम्म Useful Links थपिएको छैन।</p>'}</div>
      <button class="btn gold" id="ulSave">Save Useful Links</button><span id="ulStatus" class="muted" style="margin-left:10px"></span>
    </div>`;
    v.querySelectorAll('[data-ultitle]').forEach(el=>el.oninput=()=>links[+el.dataset.ultitle].title=el.value);
    v.querySelectorAll('[data-uldesc]').forEach(el=>el.oninput=()=>links[+el.dataset.uldesc].description=el.value);
    v.querySelectorAll('[data-ulurl]').forEach(el=>el.oninput=()=>links[+el.dataset.ulurl].url=el.value);
    v.querySelectorAll('[data-uldel]').forEach(el=>el.onclick=()=>{links.splice(+el.dataset.uldel,1);draw()});
    v.querySelectorAll('[data-ulup]').forEach(el=>el.onclick=()=>{const i=+el.dataset.ulup;[links[i-1],links[i]]=[links[i],links[i-1]];draw()});
    v.querySelectorAll('[data-uldn]').forEach(el=>el.onclick=()=>{const i=+el.dataset.uldn;[links[i+1],links[i]]=[links[i],links[i+1]];draw()});
    $('#ulAdd').onclick=()=>{links.push({title:'',description:'',url:''});draw()};
    $('#ulSave').onclick=async()=>{
      const status=$('#ulStatus');
      for(const x of links){if(!x.title.trim()||!x.url.trim()){status.textContent='Each link needs a title and URL.';return}
        try{const u=new URL(x.url);if(!['http:','https:'].includes(u.protocol))throw new Error();}catch{status.textContent='Please enter a valid http/https URL.';return}}
      $('#ulSave').disabled=true;status.textContent='Saving…';
      try{await api('/admin/settings',{method:'POST',body:JSON.stringify({useful_links:JSON.stringify(links)})});status.textContent='Saved successfully.'}
      catch(e){status.textContent=e.message}
      finally{$('#ulSave').disabled=false}
    };
  }
  draw();
}

/* ---- Departments hub ---- */
async function renderDepartments(v){
  const list=await api('/admin/departments');
  v.innerHTML=`<div class="box">
    <div class="row" style="justify-content:space-between;align-items:center;gap:8px">
      <h3 style="margin:0;font-size:16px">Departments</h3>
      <button class="btn gold" id="newDept" style="padding:6px 10px;font-size:12px">+ New</button>
    </div>
    <p class="muted" style="margin:8px 0">Open → Pages / Media। Edit → नाम/slug।</p>
    <div id="deptList">${list.map(d=>`
      <div class="item" style="align-items:center;padding:10px 12px">
        <div style="flex:1;min-width:0"><b style="font-size:14px">${esc(d.icon||'')} ${esc(d.name_en)}</b>
          <div class="muted" style="font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(d.name_ne||'')} · /dept/${esc(d.slug||d.id)}</div>
        </div>
        <div class="row" style="flex-shrink:0;gap:4px">
          <button class="btn gold" style="padding:5px 8px;font-size:11px" data-open="${d.id}">Open</button>
          <button class="btn" style="padding:5px 8px;font-size:11px" data-edit="${d.id}">Edit</button>
          <button class="btn danger" style="padding:5px 8px;font-size:11px" data-del="${d.id}">Del</button>
        </div>
      </div>`).join('')||'<p class="muted">No departments</p>'}
    </div>
    <div id="deptEd" class="hidden"></div>
    <div id="deptHub" class="hidden"></div>
  </div>`;
  $('#newDept').onclick=()=>{ $('#deptList').classList.add('hidden'); $('#deptHub').classList.add('hidden'); editDept(); };
  $$('[data-edit]').forEach(b=>b.onclick=()=>{ $('#deptList').classList.add('hidden'); $('#deptHub').classList.add('hidden'); editDept(list.find(x=>x.id==b.dataset.edit)); });
  $$('[data-del]').forEach(b=>b.onclick=async()=>{
    if(!confirm('यो department मेटाउने हो? यो कार्य उल्ट्याउन मिल्दैन।'))return;
    if(!confirm('Confirm delete?'))return;
    await api('/admin/departments/'+b.dataset.del,{method:'DELETE'});
    tab('departments');
  });
  $$('[data-open]').forEach(b=>b.onclick=()=>openDeptHub(+b.dataset.open));
}
function editDept(d){
  const ed=$('#deptEd');ed.classList.remove('hidden');ed.classList.add('workspace-active');
  ed.innerHTML=`<h3 style="margin-top:0">${d?'Edit':'New'} department</h3>
    <div class="grid2">
      <div><label>Name EN *</label><input id="d_en" value="${esc(d?.name_en||'')}"></div>
      <div><label>Name NE</label><input id="d_ne" value="${esc(d?.name_ne||'')}"></div>
      <div><label>Slug</label><input id="d_slug" value="${esc(d?.slug||'')}" placeholder="auto from name"></div>
      <div><label>Icon</label><input id="d_icon" value="${esc(d?.icon||'✦')}"></div>
      <div><label>Contact email</label><input id="d_email" value="${esc(d?.email||'')}"></div>
      <div><label>Sort</label><input id="d_sort" type="number" value="${d?.sort_order??0}"></div>
    </div>
    <label>Description EN</label><textarea id="d_den">${esc(d?.description_en||'')}</textarea>
    <label>Description NE</label><textarea id="d_dne">${esc(d?.description_ne||'')}</textarea>
    <label><input type="checkbox" id="d_vis" ${d?.visible!==0?'checked':''}> Visible</label>
    <div class="row" style="margin-top:10px"><button class="btn gold" id="saveD">Save</button><button class="btn" id="canD">Cancel</button></div>`;
  $('#canD').onclick=()=>{ed.classList.add('hidden');ed.classList.remove('workspace-active');$('#deptList').classList.remove('hidden')};
  $('#saveD').onclick=async()=>{
    await api('/admin/departments',{method:'POST',body:JSON.stringify({
      id:d?.id,name_en:$('#d_en').value.trim(),name_ne:$('#d_ne').value.trim(),slug:$('#d_slug').value.trim(),
      icon:$('#d_icon').value.trim(),email:$('#d_email').value.trim(),sort_order:Number($('#d_sort').value||0),
      description_en:$('#d_den').value.trim(),description_ne:$('#d_dne').value.trim(),visible:$('#d_vis').checked
    })});
    tab('departments');
  };
}
async function openDeptHub(id,initialSub='pages',restoreSlug=null,restoreNew=false){
  const listEl=$('#deptList');const ed=$('#deptEd');const hub=$('#deptHub');
  if(listEl)listEl.classList.add('hidden');
  if(ed){ed.classList.add('hidden');ed.classList.remove('workspace-active')}
  hub.classList.remove('hidden');hub.classList.add('workspace-active');
  setRoute({tab:'departments',deptId:Number(id),deptSub:initialSub,editorSlug:restoreSlug,editorNew:restoreNew});
  hub.innerHTML='<p class="muted">Loading…</p>';
  try{
    const data=await api('/admin/departments/'+id+'/bundle');
    const dept=data.department;
    let sub=initialSub||'pages';
    function draw(){
      hub.innerHTML=`<div>
        <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:8px">
          <h3 style="margin:0;font-size:16px">${esc(dept.icon||'')} ${esc(dept.name_en)}</h3>
          <button class="btn" id="closeHub" style="padding:5px 10px;font-size:12px">← Back</button>
        </div>
        <div class="tabs">
          <button class="${sub==='pages'?'on':''}" data-s="pages">Pages</button>
          <button class="${sub==='categories'?'on':''}" data-s="categories">Categories</button>
          <button class="${sub==='media'?'on':''}" data-s="media">Media</button>
        </div>
        <div id="subView"></div>
      </div>`;
      $('#closeHub').onclick=()=>{hub.classList.add('hidden');hub.classList.remove('workspace-active');hub.innerHTML='';$('#deptList').classList.remove('hidden');setRoute({deptId:null,deptSub:null,editorSlug:null,editorNew:false})};
      $('[data-s]').forEach(b=>b.onclick=()=>{sub=b.dataset.s;setRoute({deptSub:sub,editorSlug:null,editorNew:false});draw()});
      const sv=$('#subView');
      if(sub==='pages'){
        renderDeptPages(sv,dept,data.pages||[],data.categories||[]);
        if(restoreSlug||restoreNew){const p=(data.pages||[]).find(x=>x.slug===restoreSlug);if(p||restoreNew)openPageEditor(p||null,dept,data.categories||[],true);restoreSlug=null;restoreNew=false;}
      }
      if(sub==='categories') renderDeptCats(sv,dept,data.categories||[]);
      if(sub==='media') renderDeptMedia(sv,dept,data.media||[]);
    }
    draw();
  }catch(e){
    hub.innerHTML=`<div class="notice">Open failed: ${esc(e.message)}</div>
      <p class="muted">D1 मा column नभए ALTER चलाउनुहोस् (तलको SQL)।</p>
      <button class="btn" id="closeHub">← Back</button>`;
    $('#closeHub').onclick=()=>{hub.classList.add('hidden');hub.classList.remove('workspace-active');$('#deptList').classList.remove('hidden')};
  }
}
function renderDeptPages(sv,dept,pages,cats){
  sv.innerHTML=`<div class="row" style="justify-content:space-between"><b>Pages in this department</b><button class="btn gold" id="np">+ Page (ZIP)</button></div>
    <p class="notice">मुख्य नियम: बाहिर page ZIP बनाउनुहोस् → यहाँ upload → Preview → Publish। Block editor optional मात्र।</p>
    ${pages.map(p=>{
      const isZip=String(p.template||'').startsWith('zip:');
      return `<div class="item"><div><b>${esc(p.title_en)}</b>
      <small class="muted">/${esc(p.slug)} · ${isZip?'ZIP package':'Blocks'} · <span class="badge ${p.published?'published':'draft'}">${p.published?'Published':'Draft'}</span>
      ${p.is_popular?' · Popular':''}</small></div>
      <div class="row">
        <a class="btn" href="/_preview/${esc(p.slug)}" target="_blank" rel="noopener">Preview</a>
        <button class="btn" data-ep="${esc(p.slug)}">Edit</button>
        <button class="btn danger" data-dp="${esc(p.slug)}">Delete</button>
      </div></div>`;
    }).join('')||'<p class="muted">No pages yet</p>'}
    <div id="pageEd" class="hidden"></div>`;
  $('#np').onclick=()=>openPageEditor(null,dept,cats);
  $$('[data-ep]').forEach(b=>b.onclick=()=>openPageEditor(pages.find(x=>x.slug===b.dataset.ep),dept,cats));
  $$('[data-dp]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete page?'))return;await api('/admin/pages/'+encodeURIComponent(b.dataset.dp),{method:'DELETE'});openDeptHub(dept.id)});
}
function openPageEditor(page,dept,cats,restoring=false){
  const ed=$('#pageEd');ed.classList.remove('hidden');ed.classList.add('workspace-active');
  setRoute({tab:'departments',deptId:Number(dept.id),deptSub:'pages',editorSlug:page?.slug||null,editorNew:!page});
  const isZipExisting=page && String(page.template||'').startsWith('zip:');
  let fileList=[];
  let zipReady=false;
  ed.innerHTML=`<div class="editor-top"><h3 style="margin:0">${page?'Edit page':'New page'}</h3><button class="btn" id="editorBack" type="button">← Back to Pages</button></div>
    <div class="notice"><b>Primary:</b> Upload a ZIP of your finished page (must include <code>index.html</code>). Test offline first, then upload → Preview → Publish.</div>
    <div class="grid2">
      <div><label>Title EN *</label><input id="p_te" value="${esc(page?.title_en||'')}"></div>
      <div><label>Title NE</label><input id="p_tn" value="${esc(page?.title_ne||'')}"></div>
      <div><label>Slug * (URL)</label><input id="p_sl" value="${esc(page?.slug||'')}" ${page?'readonly':''} placeholder="my-article"></div>
      <div><label>Category</label><select id="p_cat"><option value="">—</option>${(cats||[]).map(c=>`<option value="${c.id}" ${page?.category_id==c.id?'selected':''}>${esc(c.name_en)}</option>`).join('')}</select></div>
    </div>
    <label>Description EN</label><textarea id="p_de" rows="2">${esc(page?.description_en||'')}</textarea>
    <label>Description NE</label><textarea id="p_dn" rows="2">${esc(page?.description_ne||'')}</textarea>
    <div class="box" style="background:#f7f8fb;margin:12px 0">

      <p class="muted">खाली छोड्दा system ले page भित्रको पहिलो उपयुक्त image छान्छ। चाहनु भए यहाँ आफैँ image र छोटो teaser राख्न सक्नुहुन्छ।</p>
      <label>Thumbnail image URL (optional override)</label><input id="p_thumb" value="${esc(page?.thumbnail_image||'')}" placeholder="/media/... or /_p/...">
      <div class="grid2">
        <div><label>Card title EN</label><input id="p_ttitle_en" value="${esc(page?.thumbnail_title_en||'')}"></div>
        <div><label>Card title NE</label><input id="p_ttitle_ne" value="${esc(page?.thumbnail_title_ne||'')}"></div>
        <div><label>Short summary EN</label><textarea id="p_tsum_en" rows="2">${esc(page?.thumbnail_summary_en||'')}</textarea></div>
        <div><label>Short summary NE</label><textarea id="p_tsum_ne" rows="2">${esc(page?.thumbnail_summary_ne||'')}</textarea></div>
      </div>
      <label>Image alt text</label><input id="p_talt" value="${esc(page?.thumbnail_alt||'')}">
      <div class="grid2"><div><label>Image focus X (0–100)</label><input id="p_fx" type="number" min="0" max="100" value="${Number(page?.thumbnail_focal_x??50)}"></div><div><label>Image focus Y (0–100)</label><input id="p_fy" type="number" min="0" max="100" value="${Number(page?.thumbnail_focal_y??50)}"></div></div>
    </div>
    <label><input type="checkbox" id="p_pub" ${page?.published?'checked':''}> Published (live)</label>
    <label><input type="checkbox" id="p_pop" ${page?.is_popular?'checked':''}> Popular on homepage</label>

    <div class="editor-mode-tabs">
      <button type="button" id="modeZip" class="btn">ZIP Upload</button>
      <button type="button" id="modeBlocks" class="btn">Block PageMaker</button>
    </div>
    <div id="zipPanel" class="editor-panel">
      <h4 style="margin-top:0">ZIP package upload</h4>
      <p class="muted">ZIP भित्र index.html + CSS/JS/images राख्नुहोस्। Mobile बाट पनि छान्न मिल्छ।</p>
      <input type="file" id="zipFile" accept=".zip,application/zip">
      <div id="zipStatus" class="muted" style="margin-top:8px">${isZipExisting?'Existing ZIP page — upload new ZIP to replace files.':'No ZIP selected yet.'}</div>
      <ul id="zipList" class="muted" style="font-size:12px;max-height:120px;overflow:auto"></ul>
      <button class="btn gold" type="button" id="uploadZip" style="margin-top:8px">Upload ZIP to server</button>
    </div>
    <div class="row" style="margin-top:14px">
      <button class="btn gold" id="saveP">Save page</button>
      <a class="btn" id="prevP" href="#" target="_blank" rel="noopener">Preview</a>
      <button class="btn" id="canP">Cancel</button>
    </div>
    <div id="blocksWrap" class="editor-panel" hidden>
      <p class="muted">Optional only — if you are not using ZIP.</p>
      <div class="builder">
        <div><div class="canvas" id="canvas"></div></div>
        <div class="palette">
          <p><b>Tap to add blocks</b></p>
          <button type="button" data-add="heading">＋ Heading</button>
          <button type="button" data-add="paragraph">＋ Paragraph</button>
          <button type="button" data-add="image">＋ Image</button>
          <button type="button" data-add="video">＋ Video</button>
          <button type="button" data-add="button">＋ Button / Link</button>
          <button type="button" data-add="quote">＋ Quote</button>
          <button type="button" data-add="divider">＋ Divider</button>
          <button type="button" data-add="html">＋ Custom HTML</button>
          <p class="muted">On mobile use ↑ / ↓ to reorder blocks.</p>
        </div>
      </div>
    </div>`;

  let blocks=[];
  try{if(page&&!isZipExisting)blocks=typeof page.content==='string'?JSON.parse(page.content):page.content||[]}catch{blocks=[]}
  let useZip=isZipExisting || !page;
  let entryFile='index.html';
  if(isZipExisting) entryFile=String(page.template).slice(4)||'index.html';
  function selectEditorMode(mode){
    useZip=mode==='zip';$('#zipPanel').hidden=!useZip;$('#blocksWrap').hidden=useZip;
    $('#modeZip').classList.toggle('on',useZip);$('#modeBlocks').classList.toggle('on',!useZip);
  }
  $('#modeZip').onclick=()=>selectEditorMode('zip');
  $('#modeBlocks').onclick=()=>selectEditorMode('blocks');
  selectEditorMode(isZipExisting||!page?'zip':'blocks');
  $('#editorBack').onclick=()=>{ed.classList.add('hidden');ed.classList.remove('workspace-active');setRoute({editorSlug:null,editorNew:false})};
  $('#canP').onclick=()=>{ed.classList.add('hidden');ed.classList.remove('workspace-active');setRoute({editorSlug:null,editorNew:false})};
  if(restoring)setTimeout(restoreDraft,60);
  $('#prevP').onclick=(e)=>{
    const slug=$('#p_sl').value.trim()||$('#p_te').value.trim();
    if(!slug){e.preventDefault();alert('Save slug first');return}
    $('#prevP').href='/_preview/'+encodeURIComponent(slugifyClient(slug));
  };

  $('#uploadZip').onclick=async()=>{
    const f=$('#zipFile').files[0];
    if(!f)return alert('Choose a .zip file');
    const slug=slugifyClient($('#p_sl').value.trim()||$('#p_te').value.trim());
    if(!slug)return alert('Set Title or slug first');
    $('#p_sl').value=slug;
    const st=$('#zipStatus');
    st.textContent='Reading ZIP…';
    try{
      const zip=await JSZip.loadAsync(f);
      const names=[];
      zip.forEach((path,entry)=>{if(!entry.dir)names.push(path.replace(/\\/g,'/'))});
      // prefer root index.html
      let indexPath=names.find(n=>n==='index.html')||names.find(n=>n.endsWith('/index.html'))||names.find(n=>/\.html?$/i.test(n));
      if(!indexPath)throw new Error('ZIP must contain index.html');
      entryFile=indexPath.includes('/')?indexPath.split('/').pop():indexPath;
      // if files in a single top folder, strip that prefix for R2 keys relative to entry folder
      let prefix='';
      const parts=indexPath.split('/');
      if(parts.length>1){prefix=parts.slice(0,-1).join('/')+'/';entryFile=parts[parts.length-1]}
      fileList=names;
      $('#zipList').innerHTML=names.slice(0,40).map(n=>`<li>${esc(n)}</li>`).join('')+(names.length>40?'<li>…</li>':'');
      st.textContent=`Uploading ${names.length} files…`;
      let done=0;
      for(const path of names){
        const entry=zip.file(path);
        if(!entry)continue;
        let rel=path.replace(/\\/g,'/');
        if(prefix&&rel.startsWith(prefix))rel=rel.slice(prefix.length);
        if(!rel||rel.includes('..'))continue;
        const buf=await entry.async('arraybuffer');
        const ct=guessType(rel);
        const r=await fetch('/api/admin/pages/asset',{
          method:'POST',
          headers:{
            'content-type':ct,
            'x-page-slug':slug,
            'x-department-id':String(dept.id),
            'x-rel-path':encodeURIComponent(rel)
          },
          body:buf
        });
        const d=await r.json();
        if(!r.ok)throw new Error(d.error||'Upload failed: '+rel);
        done++;
        st.textContent=`Uploaded ${done}/${names.length}…`;
      }
      // save page meta as draft zip
      await api('/admin/pages',{method:'POST',body:JSON.stringify({
        slug,title_en:$('#p_te').value.trim()||slug,title_ne:$('#p_tn').value.trim(),
        description_en:$('#p_de').value.trim(),description_ne:$('#p_dn').value.trim(),
        department_id:dept.id,category_id:$('#p_cat').value?Number($('#p_cat').value):null,
        published:false,is_popular:$('#p_pop').checked,
        thumbnail_image:$('#p_thumb').value.trim(),thumbnail_title_en:$('#p_ttitle_en').value.trim(),thumbnail_title_ne:$('#p_ttitle_ne').value.trim(),
        thumbnail_summary_en:$('#p_tsum_en').value.trim(),thumbnail_summary_ne:$('#p_tsum_ne').value.trim(),thumbnail_alt:$('#p_talt').value.trim(),
        thumbnail_focal_x:Number($('#p_fx').value||50),thumbnail_focal_y:Number($('#p_fy').value||50),
        source_type:'zip',entry_file:entryFile,
        content:{files:names,entry:entryFile}
      })});
      zipReady=true;useZip=true;
      st.textContent=`OK — ${done} files. Now Preview, then check Published and Save.`;
      $('#prevP').href='/_preview/'+encodeURIComponent(slug);
    }catch(e){st.textContent='Error: '+e.message;alert(e.message)}
  };

  // minimal optional blocks
  const canvas=$('#canvas');
  function drawBlocks(){
    if(!canvas)return;
    canvas.innerHTML=blocks.map((b,i)=>{
      const field=(key,label,val,area=false)=>'<label>'+label+'</label>'+(area?'<textarea data-field="'+key+'" data-i="'+i+'" rows="3">'+esc(val||'')+'</textarea>':'<input data-field="'+key+'" data-i="'+i+'" value="'+esc(val||'')+'">');
      let fields='';
      if(b.type==='heading')fields=field('text','Heading text',b.text)+field('level','Level (1–4)',b.level||2);
      else if(b.type==='paragraph'||b.type==='quote')fields=field('text',b.type==='quote'?'Quote':'Paragraph',b.text,true)+(b.type==='quote'?field('cite','Citation',b.cite):'');
      else if(b.type==='image')fields=field('url','Image URL',b.url)+field('alt','Alt text',b.alt)+field('caption','Caption',b.caption)+'<div class="row"><label class="btn" style="display:inline-block;cursor:pointer">＋ Add Image<input type="file" accept="image/*" data-upload="'+i+'" hidden></label><button type="button" class="btn" data-library="'+i+'">Media Library</button></div>';
      else if(b.type==='video')fields=field('url','Video URL or uploaded video URL',b.url)+'<div class="row"><label class="btn" style="display:inline-block;cursor:pointer">＋ Add Video<input type="file" accept="video/*" data-upload="'+i+'" hidden></label><button type="button" class="btn" data-library="'+i+'">Media Library</button></div>';
      else if(b.type==='button')fields=field('text','Button label',b.text)+field('url','Button link',b.url);
      else if(b.type==='html')fields=field('html','HTML code',b.html,true);
      else fields='<p class="muted">Divider block</p>';
      return '<div class="block" style="display:block;margin:10px 0;padding:12px;border:1px solid #dce3ed;border-radius:10px;background:#fff"><div class="row" style="justify-content:space-between"><b>'+esc(b.type.toUpperCase())+'</b><div class="row"><button type="button" class="btn" data-up="'+i+'" '+(i===0?'disabled':'')+'>↑</button><button type="button" class="btn" data-down="'+i+'" '+(i===blocks.length-1?'disabled':'')+'>↓</button><button type="button" class="btn danger" data-rm="'+i+'">Remove</button></div></div><div style="margin-top:8px">'+fields+'</div></div>';
    }).join('')||'<p class="muted">No blocks yet. Add a block from the buttons.</p>';
    canvas.querySelectorAll('[data-rm]').forEach(btn=>btn.onclick=()=>{blocks.splice(+btn.dataset.rm,1);drawBlocks()});
    canvas.querySelectorAll('[data-up]').forEach(btn=>btn.onclick=()=>{const i=+btn.dataset.up;if(i>0){[blocks[i-1],blocks[i]]=[blocks[i],blocks[i-1]];drawBlocks()}});
    canvas.querySelectorAll('[data-down]').forEach(btn=>btn.onclick=()=>{const i=+btn.dataset.down;if(i<blocks.length-1){[blocks[i+1],blocks[i]]=[blocks[i],blocks[i+1]];drawBlocks()}});
    canvas.querySelectorAll('[data-field]').forEach(el=>el.oninput=()=>{const b=blocks[+el.dataset.i],k=el.dataset.field;b[k]=k==='level'?Number(el.value):el.value});
    canvas.querySelectorAll('[data-library]').forEach(btn=>btn.onclick=async()=>{
      const idx=+btn.dataset.library,block=blocks[idx];
      try{
        const all=await api('/admin/media?department_id='+encodeURIComponent(dept.id));
        const allowed=all.filter(m=>block.type==='image'?(m.content_type||'').startsWith('image/'):(m.content_type||'').startsWith('video/'));
        if(!allowed.length){alert('No matching uploads in Media Library yet. Upload a file first.');return}
        const card=btn.closest('.block'),select=document.createElement('select');
        select.style.marginTop='8px';select.innerHTML='<option value="">Choose an uploaded '+block.type+'…</option>'+allowed.map(m=>'<option value="'+esc(m.url)+'">'+esc(m.name)+' · '+Math.ceil((m.size||0)/1024)+' KB</option>').join('');
        const previous=card.querySelector('[data-library-select]');if(previous)previous.remove();
        select.setAttribute('data-library-select','');card.appendChild(select);
        select.onchange=()=>{if(select.value){block.url=select.value;drawBlocks()}};
      }catch(e){alert(e.message)}
    });
    canvas.querySelectorAll('[data-upload]').forEach(el=>el.onchange=async()=>{
      const file=el.files&&el.files[0];if(!file)return;
      const idx=+el.dataset.upload,st=$('#zipStatus');if(st)st.textContent='Uploading '+file.name+'…';
      try{
        const slug=slugifyClient($('#p_sl').value.trim()||$('#p_te').value.trim());
        if(!slug)throw new Error('Set page title/slug first.');
        const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_'),rel='builder/'+Date.now()+'-'+safe;
        const r=await fetch('/api/admin/pages/asset',{method:'POST',headers:{'content-type':file.type||'application/octet-stream','x-page-slug':slug,'x-department-id':String(dept.id),'x-rel-path':encodeURIComponent(rel)},body:file});
        const d=await r.json();if(!r.ok)throw new Error(d.error||'Upload failed');
        blocks[idx].url=d.url||('/media/pages/'+slug+'/'+rel);drawBlocks();if(st)st.textContent='Uploaded '+file.name;
      }catch(err){alert(err.message)}
    });
  }
  drawBlocks();
  $('[data-add]',ed).forEach(btn=>btn.onclick=()=>{
    const t=btn.dataset.add;
    useZip=false;
    const defaults={heading:{type:t,text:'New heading',level:2},paragraph:{type:t,text:'Write your paragraph here.'},image:{type:t,url:'',alt:'',caption:''},video:{type:t,url:''},button:{type:t,text:'Learn more',url:'#'},quote:{type:t,text:'Quote text',cite:''},divider:{type:t},html:{type:t,html:''}};
    blocks.push(defaults[t]||{type:t,text:''});
    drawBlocks();
  });

  $('#saveP').onclick=async()=>{
    const slug=slugifyClient($('#p_sl').value.trim()||$('#p_te').value.trim());
    if(!$('#p_te').value.trim())return alert('Title required');
    try{
      const payload={
        slug,title_en:$('#p_te').value.trim(),title_ne:$('#p_tn').value.trim(),
        description_en:$('#p_de').value.trim(),description_ne:$('#p_dn').value.trim(),
        department_id:dept.id,category_id:$('#p_cat').value?Number($('#p_cat').value):null,
        published:$('#p_pub').checked,is_popular:$('#p_pop').checked,
        thumbnail_image:$('#p_thumb').value.trim(),thumbnail_title_en:$('#p_ttitle_en').value.trim(),thumbnail_title_ne:$('#p_ttitle_ne').value.trim(),
        thumbnail_summary_en:$('#p_tsum_en').value.trim(),thumbnail_summary_ne:$('#p_tsum_ne').value.trim(),thumbnail_alt:$('#p_talt').value.trim(),
        thumbnail_focal_x:Number($('#p_fx').value||50),thumbnail_focal_y:Number($('#p_fy').value||50)
      };
      if(useZip||zipReady||isZipExisting){
        payload.source_type='zip';
        payload.entry_file=entryFile||'index.html';
        payload.content={files:fileList,entry:entryFile};
      }else{
        payload.source_type='blocks';
        payload.content=blocks;
      }
      const r=await api('/admin/pages',{method:'POST',body:JSON.stringify(payload)});
      alert('Saved /'+r.slug+(payload.published?' (Published)':' (Draft — use Preview)'));
      setRoute({editorSlug:null,editorNew:false,deptSub:'pages'});openDeptHub(dept.id,'pages');
    }catch(e){alert(e.message)}
  };
}
function slugifyClient(s){return String(s||'').toLowerCase().trim().replace(/[^a-z0-9-]+/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'')}
function guessType(name){
  const n=name.toLowerCase();
  if(n.endsWith('.html')||n.endsWith('.htm'))return 'text/html; charset=utf-8';
  if(n.endsWith('.css'))return 'text/css; charset=utf-8';
  if(n.endsWith('.js'))return 'application/javascript; charset=utf-8';
  if(n.endsWith('.json'))return 'application/json';
  if(n.endsWith('.svg'))return 'image/svg+xml';
  if(n.endsWith('.png'))return 'image/png';
  if(n.endsWith('.jpg')||n.endsWith('.jpeg'))return 'image/jpeg';
  if(n.endsWith('.gif'))return 'image/gif';
  if(n.endsWith('.webp'))return 'image/webp';
  if(n.endsWith('.woff2'))return 'font/woff2';
  if(n.endsWith('.woff'))return 'font/woff';
  return 'application/octet-stream';
}

      <div class="row"><button class="btn" data-ec="${c.id}">Edit</button><button class="btn danger" data-dc="${c.id}">Delete</button></div></div>`).join('')||'<p class="muted">No categories — optional</p>'}

    :'<p class="muted">अहिले खाली — page ZIP upload गर्दा media यहाँ आउँछ।</p>'}
    <input type="file" id="repPick" class="hidden">`;
  // Add file to page folder
  $$('[data-addpage]').forEach(b=>b.onclick=async()=>{

    const inp=$('#add-'+pg);
    const f=inp?.files?.[0];if(!f)return alert('Choose a file first');
    try{
      const rel=f.name.replace(/[^a-zA-Z0-9._-]/g,'_');
      const r=await fetch('/api/admin/pages/asset',{method:'POST',headers:{
        'content-type':f.type||'application/octet-stream','x-page-slug':pg,'x-department-id':String(dept.id),'x-rel-path':encodeURIComponent(rel)
      },body:f});
      const d=await r.json();if(!r.ok)throw new Error(d.error);
      alert('Added: '+d.url);openDeptHub(dept.id);
    }catch(e){alert(e.message)}

  $$('[data-rep]').forEach(b=>b.onclick=()=>{
    const pick=$('#repPick');

      const f=pick.files[0];if(!f)return;

      if(!ps){alert('This file is not linked to a page path');return}
      // rel path from key pages/{slug}/rel
      const prefix='pages/'+ps+'/';
      const rel=key.startsWith(prefix)?key.slice(prefix.length):name;
      try{
        const r=await fetch('/api/admin/pages/asset',{method:'POST',headers:{
          'content-type':f.type||'application/octet-stream','x-page-slug':ps,'x-department-id':String(dept.id),'x-rel-path':encodeURIComponent(rel)

    };
    pick.click();
  });
  $$('[data-dm]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this media file?'))return;await api('/admin/media/'+encodeURIComponent(b.dataset.dm),{method:'DELETE'});openDeptHub(dept.id)});

function parseReplyDisplay(raw){
  if(!raw)return {text:'',atts:[],inbound:false};
  try{const j=JSON.parse(raw);if(j&&j.inbound)return {text:'',atts:j.attachments||[],inbound:true}}catch{}
  const m=String(raw).match(/\n\n<!--ATTACH:([\s\S]*?)-->$/);
  if(!m)return {text:raw,atts:[],inbound:false};
  try{return {text:raw.slice(0,m.index),atts:JSON.parse(m[1]),inbound:false}}catch{return {text:raw,atts:[],inbound:false}}
}
async function compressMailImage(file){
  if(!file.type||!file.type.startsWith('image/')||file.type==='image/gif'||file.type==='image/svg+xml')return file;
  try{
    const bmp=await createImageBitmap(file);
    let scale=Math.min(1,1800/Math.max(bmp.width,bmp.height));
    let canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');
    let blob=null;
    for(let pass=0;pass<8;pass++){
      canvas.width=Math.max(1,Math.round(bmp.width*scale));
      canvas.height=Math.max(1,Math.round(bmp.height*scale));
      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.drawImage(bmp,0,0,canvas.width,canvas.height);
      for(const q of [.78,.65,.52,.4,.3]){
        blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',q));
        if(blob&&blob.size<=100*1024)break;
      }
      if(blob&&blob.size<=100*1024)break;
      scale*=.78;
    }
    bmp.close();
    if(!blob)return file;
    const base=file.name.replace(/\.[^.]+$/,'')||'image';
    return new File([blob],base+'.jpg',{type:'image/jpeg',lastModified:Date.now()});
  }catch{return file}
}

 सबै विचार सबैले स्वीकार गर्नैपर्छ भन्ने हाम्रो दाबी छैन। तपाईंका सुझाव, प्रश्न, आलोचना र सुधारका कुरा स्वागतयोग्य छन्। कुनै त्रुटि औँल्याइएमा हामी समीक्षा गरी आवश्यक सुधार वा अद्यावधिक गर्नेछौँ।\n\nकुनै व्यक्ति, समूह वा संस्थालाई अपमान, धम्की, दुर्व्यवहार, भ्रम वा जानाजानी हानि पुर्‍याउने उद्देश्यले सामग्री प्रकाशित गर्ने हाम्रो मनसाय छैन। कुनै सामग्री संयोगवश कसैसँग मेल खान गएमा वा कसैलाई असर परेको महसुस भएमा हामी हृदयदेखि क्षमाप्रार्थी छौँ। कृपया सम्बन्धित पेजको लिंक र विवरणसहित जानकारी दिनुहोस्, हामी उचित समीक्षा र आवश्यक कदम चाल्नेछौँ।\n\nGranshi मा आउनुभएको, सिक्नुभएको र यसलाई अझ राम्रो बनाउन सहयोग गर्नुभएकोमा धन्यवाद।"},"contact":{"en":"We welcome questions, suggestions, corrections, collaboration ideas and reports about content.\n\nEmail: info@gopalkoirala.com.np\n\nYou can also use the contact form available on the website. When reporting a problem, please include the page link and explain what should be reviewed. We will make a reasonable effort to read and respond to genuine messages.\n\nPlease do not send passwords, financial details or other sensitive personal information.","ne":"तपाईंका प्रश्न, सुझाव, सुधारका प्रस्ताव, सहकार्यका विचार तथा सामग्रीसम्बन्धी गुनासो हामीलाई स्वागत छ।\n\nइमेल: info@gopalkoirala.com.np\n\nवेबसाइटमा उपलब्ध Contact Form बाट पनि सन्देश पठाउन सक्नुहुन्छ। कुनै सामग्री सच्याउन वा समीक्षा गराउन चाहनुहुन्छ भने सम्बन्धित पेजको लिंक र स्पष्ट विवरण दिनुहोस्। हामी वास्तविक र उपयोगी सन्देश पढ्ने तथा सम्भव भएसम्म जवाफ दिने प्रयास गर्नेछौँ।\n\nकृपया पासवर्ड, बैंक विवरण वा अन्य संवेदनशील व्यक्तिगत जानकारी सामान्य फारम वा इमेलमार्फत नपठाउनुहोस्।"},"privacy":{"en":"Granshi is a personally operated website. We aim to collect only information that is reasonably needed to operate the website and respond to visitors.\n\nIf you contact us, submit a form or post feedback, we may receive details such as your name, email address and message. These details are used to respond, review suggestions, moderate feedback and maintain the website. Basic techni
