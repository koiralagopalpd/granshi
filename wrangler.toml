name = "granshi"
main = "src/worker.js"
compatibility_date = "2026-11-05"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "granshi-db"
database_id = "d3e055f9-36f2-4d9e-8891-c6532c1ab05f"
migrations_dir = "database"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "granshi-media"

[vars]
ENVIRONMENT = "production"
# Secrets (wrangler secret put):
# SESSION_SECRET
# SETUP_TOKEN
# RESEND_API_KEY  (optional – real email)
# RESEND_WEBHOOK_SECRET  (required to verify Resend email.received webhooks)
[observability]
enabled = true
[observability.logs]
invocation_logs = true
head_sampling_rate = 1

# Isolated resources used only by Wrangler preview deployments.
[previews.vars]
ENVIRONMENT = "preview"

[[previews.d1_databases]]
binding = "DB"
database_id = "f19ddd3e-7e31-4db3-b6db-4ccac43e0f7b"

[[previews.r2_buckets]]
binding = "MEDIA"
bucket_name = "granshi-preview-media"
