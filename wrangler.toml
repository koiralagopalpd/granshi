name = "granshi"
main = "src/worker.js"
compatibility_date = "2026-11-05"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/media/*"]

[[d1_databases]]
binding = "DB"
database_name = "granshi-db"
database_id = "d3e055f9-36f2-4d9e-8891-c6532c1ab05f"
migrations_dir = "database"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "granshi-media"

[vars]
ENVIRONMENT = "production"
# Secrets (wrangler secret put):
# SESSION_SECRET
# SETUP_TOKEN
# RESEND_API_KEY  (optional – real email){
  // ...
  "observability": {
    "enabled": false,
    "head_sampling_rate": 1,
    "redact_query_string": false,
    "logs": {
      "enabled": true,
      "head_sampling_rate": 1,
      "invocation_logs": true,
      "persist": true
    },
    "traces": {
      "enabled": false,
      "head_sampling_rate": 1,
      "persist": true
    },
    "issues": {
      "enabled": true
    }
  },
  // ...
}
