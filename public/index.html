<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Granshi Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f0f2f7;color:#182338;font-family:system-ui,Arial}.hidden{display:none!important}
.login{max-width:430px;margin:8vh auto;background:#fff;padding:28px;border-radius:18px;box-shadow:0 15px 50px #16243b18}
input,textarea,select{width:100%;padding:11px 12px;border:1px solid #dfe4ec;border-radius:9px;margin:5px 0 12px;font:inherit;background:#fff}
input[type=checkbox]{width:auto;margin-right:7px}.btn{background:#172640;color:#fff;border:0;border-radius:9px;padding:10px 15px;font-weight:700;cursor:pointer}.btn:disabled{opacity:.5;cursor:wait}.gold{background:#d8b46a;color:#182338}.danger{background:#a83333}.muted{color:#68758a;font-size:13px;line-height:1.5}
.shell{display:grid;grid-template-columns:225px 1fr;min-height:100vh}.side{background:#101a2c;color:#fff;padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto}.side h2{padding:4px 12px}.side button{display:block;width:100%;text-align:left;background:none;color:#dce3ed;border:0;padding:11px 12px;border-radius:9px;cursor:pointer;font:inherit}.side button.active,.side button:hover{background:#ffffff18;color:#f1d99e}.main{padding:22px;min-width:0}.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.box{background:#fff;border:1px solid #e4e8ef;border-radius:14px;padding:18px;margin-top:14px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{font-size:12px;font-weight:700;display:block}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.item{padding:12px;border:1px solid #e5e9ef;border-radius:10px;margin:8px 0;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;background:#fafbfd}.item small{display:block;color:#6a7689;margin-top:4px}.notice{background:#fff5df;padding:11px 13px;border-radius:10px;color:#775820;font-size:13px;line-height:1.5;margin:10px 0}.badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;background:#e8f5e9;color:#2e7d32}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}.stat{background:#f7f8fb;border-radius:12px;padding:16px;text-align:center}.stat b{display:block;font-size:24px}.form-actions{margin-top:14px}.form-panel{border-top:1px solid #e8ebf0;margin-top:14px;padding-top:14px}.builder{display:grid;grid-template-columns:1fr 230px;gap:12px}.canvas{min-height:150px;background:#f7f8fb;border:2px dashed #d0d7e4;border-radius:12px;padding:10px}.block{background:white;border:1px solid #dfe4ec;border-radius:9px;padding:10px;margin:8px 0}.palette button{display:block;width:100%;margin:5px 0;padding:8px;border:1px solid #ddd;border-radius:8px;background:#fff;text-align:left}
@media(max-width:850px){.shell{grid-template-columns:1fr}.side{position:relative;height:auto;display:flex;overflow:auto;gap:4px;padding:8px}.side h2{display:none}.side button{white-space:nowrap;width:auto}.main{padding:12px}.grid2,.builder{grid-template-columns:1fr}.item{flex-direction:column}}
</style>
</head>
<body>
<div id="login" class="login">
<h1>GRANSHI ADMIN</h1><p class="muted">Pages, Departments, Media and Marketplace management.</p>
<div id="setupNote" class="notice hidden">First run: create the admin account using your setup token.</div>
<label>Email</label><input id="email" type="email" autocomplete="username">
<label>Password</label><input id="password" type="password" autocomplete="current-password">
<div id="setupTokenField" class="hidden"><label>Setup token</label><input id="setupToken" type="password"></div>
<button class="btn gold" id="loginBtn">Log in</button><p id="loginStatus" class="muted"></p>
</div>
<div id="app" class="shell hidden">
<aside class="side"><h2>GRANSHI</h2>
<button data-tab="overview" class="active">Overview</button><button data-tab="pages">Pages</button><button data-tab="departments">Departments</button><button data-tab="messages">Messages</button><button data-tab="menus">Menus</button><button data-tab="media">Media</button><button data-tab="products">Products</button><button data-tab="categories">Product Categories</button><button data-tab="orders">Orders</button><button data-tab="settings">Settings</button><button data-tab="security">Security</button><button id="logout" style="color:#f5a8a8;margin-top:14px">Log out</button>
</aside><main class="main"><div class="bar"><h1 id="tabTitle" style="font-size:22px;margin:0">Overview</h1><span id="who" class="muted"></span></div><div id="view"></div></main>
</div>
<script>
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opts={}){const headers={...(opts.body instanceof FormData?{}:{'content-type':'application/json'}),...(opts.headers||{})};const r=await fetch('/api'+path,{...opts,headers});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||`Request failed (${r.status})`);return d}
async function boot(){try{const s=await api('/setup/status');if(!s.initialized){$('#setupNote').classList.remove('hidden');$('#setupTokenField').classList.remove('hidden');$('#loginBtn').textContent='Create admin'}}catch{}try{const me=await api('/auth/me');showApp(me.email)}catch{$('#login').classList.remove('hidden')}}
$('#loginBtn').onclick=async()=>{const email=$('#email').value.trim(),password=$('#password').value;$('#loginStatus').textContent='Working…';try{if(!$('#setupTokenField').classList.contains('hidden'))await api('/setup',{method:'POST',body:JSON.stringify({email,password,setupToken:$('#setupToken').value})});else await api('/auth/login',{method:'POST',body:JSON.stringify({email,password})});showApp(email)}catch(e){$('#loginStatus').textContent=e.message}};
$('#logout').onclick=async()=>{try{await api('/auth/logout',{method:'POST'})}finally{location.reload()}};
const titles={overview:'Overview',pages:'Pages',departments:'Departments',messages:'Messages / Inbox',menus:'Menus',media:'Media Library',products:'Marketplace Products',categories:'Marketplace Categories',orders:'Orders',settings:'Site Settings',security:'Security'};
function showApp(email){$('#login').classList.add('hidden');$('#app').classList.remove('hidden');$('#who').textContent=email;$$('[data-tab]').forEach(b=>b.onclick=()=>{ $$('.side [data-tab]').forEach(x=>x.classList.toggle('active',x===b));tab(b.dataset.tab)});tab('overview')}
async function tab(name){$('#tabTitle').textContent=titles[name]||name;const v=$('#view');v.innerHTML='<div class="box muted">Loading…</div>';try{if(name==='overview'){const d=await api('/admin/overview');v.innerHTML=`<div class="box"><div class="stats"><div class="stat"><b>${(d.pages||[]).length}</b><span>Pages</span></div><div class="stat"><b>${(d.departments||[]).length}</b><span>Departments</span></div><div class="stat"><b>${d.new_messages||0}</b><span>New messages</span></div><div class="stat"><b>${d.product_count||0}</b><span>Products</span></div></div></div>`}
else if(name==='pages')await pages(v);else if(name==='departments')await departments(v);else if(name==='messages')await messages(v);else if(name==='menus')await menus(v);else if(name==='media')await media(v);else if(name==='products')await products(v);else if(name==='categories')await categories(v);else if(name==='orders')await orders(v);else if(name==='settings')await settings(v);else if(name==='security')security(v)}catch(e){v.innerHTML=`<div class="box">Error: ${esc(e.message)}</div>`}}
function listForm(v,title,items,render,addLabel='+ Add'){v.innerHTML=`<section class="box"><div id="listView"><div class="row" style="justify-content:space-between"><h3>${title}</h3><button class="btn gold" id="add">${addLabel}</button></div><div id="items"></div></div><div id="formView" class="form-panel hidden"></div></section>`;$('#items',v).innerHTML=items||'<p class="muted">No records.</p>';$('#add',v).onclick=()=>render(null)}
function showForm(id,html){const l=$(id);const f=$(id.replace('listView','formView'));l.classList.add('hidden');f.classList.remove('hidden');f.innerHTML=html}
function closeForm(){const f=$('#formView');if(f){f.classList.add('hidden');$('#listView')?.classList.remove('hidden')}}
function actions(){return `<div class="form-actions row"><button class="btn gold" id="saveForm">Save</button><button class="btn" id="cancelForm">Cancel</button></div>`}
async function pages(v){const a=await api('/admin/pages');listForm(v,'Pages',a.map(p=>`<div class="item"><div><b>${esc(p.title_en)}</b><small>/${esc(p.slug)} · ${p.published?'Published':'Draft'}</small></div><div class="row"><button class="btn" data-edit="${esc(p.slug)}">Edit</button><button class="btn danger" data-del="${esc(p.slug)}">Delete</button></div></div>`).join(''),p=>pageForm(p));$$('[data-edit]',v).forEach(b=>b.onclick=()=>pageForm(a.find(p=>p.slug===b.dataset.edit)));$$('[data-del]',v).forEach(b=>b.onclick=async()=>{if(confirm('Delete this page?'))try{await api('/admin/pages/'+encodeURIComponent(b.dataset.del),{method:'DELETE'});tab('pages')}catch(e){alert(e.message)}})}
async function pageForm(p){const v=$('#view');showForm('#listView',`<h3>${p?'Edit':'New'} page</h3><div class="notice">Current Worker supports the existing content-block page format. ZIP upload/preview/replace requires matching ZIP API routes in src/worker.js; this screen does not pretend ZIP upload is active.</div><div class="grid2"><div><label>Title EN *</label><input id="pten" value="${esc(p?.title_en||'')}"></div><div><label>Title NE</label><input id="ptne" value="${esc(p?.title_ne||'')}"></div><div><label>Slug</label><input id="pslug" value="${esc(p?.slug||'')}" ${p?'readonly':''}></div><div><label>Sort order</label><input id="psort" type="number" value="${p?.sort_order??0}"></div><div><label>Description EN</label><textarea id="pden">${esc(p?.description_en||'')}</textarea></div><div><label>Description NE</label><textarea id="pdne">${esc(p?.description_ne||'')}</textarea></div></div><label><input id="ppub" type="checkbox" ${p?.published?'checked':''}> Published</label><h4>Content blocks (legacy)</h4><div id="blocks"></div><div class="row"><button class="btn" data-block="heading">+ Heading</button><button class="btn" data-block="paragraph">+ Paragraph</button><button class="btn" data-block="image">+ Image</button><button class="btn" data-block="video">+ Video</button></div>${actions()}`);
let blocks=[];try{blocks=p?.content?(typeof p.content==='string'?JSON.parse(p.content):p.content):[]}catch{}
const draw=()=>{$('#blocks').innerHTML=blocks.map((b,i)=>`<div class="block"><b>${esc(b.type)}</b><button class="btn danger" data-rm="${i}" style="float:right">Remove</button>${b.type==='heading'?`<input data-bi="${i}" data-key="text" value="${esc(b.text||'')}" placeholder="Heading">`:b.type==='paragraph'?`<textarea data-bi="${i}" data-key="text">${esc(b.text||'')}</textarea>`:b.type==='image'?`<input data-bi="${i}" data-key="url" value="${esc(b.url||'')}" placeholder="Image URL"><input type="file" accept="image/*" data-upimg="${i}">`:b.type==='video'?`<input data-bi="${i}" data-key="url" value="${esc(b.url||'')}" placeholder="Video URL"><input type="file" accept="video/*" data-upvid="${i}">`:''}</div>`).join('')||'<p class="muted">No blocks added.</p>';$$('[data-bi]').forEach(x=>x.oninput=()=>blocks[+x.dataset.bi][x.dataset.key]=x.value);$$('[data-rm]').forEach(x=>x.onclick=()=>{blocks.splice(+x.dataset.rm,1);draw()});[['[data-upimg]','image/'],['[data-upvid]','video/']].forEach(([sel,type])=>$$ (sel).forEach(x=>x.onchange=async()=>{const f=x.files[0];if(!f)return;if(!f.type.startsWith(type))return alert('Invalid file type');if(f.size>25*1024*1024)return alert('Maximum 25 MB');try{const r=await fetch('/api/admin/media/upload',{method:'POST',headers:{'content-type':f.type,'x-file-name':encodeURIComponent(f.name)},body:f});const d=await r.json();if(!r.ok)throw Error(d.error||'Upload failed');blocks[+x.dataset[sel.includes('upimg')?'upimg':'upvid']].url=d.url;draw()}catch(e){alert(e.message)}}))};
draw();$$('[data-block]').forEach(b=>b.onclick=()=>{const t=b.dataset.block;blocks.push(t==='heading'?{type:t,text:''}:t==='paragraph'?{type:t,text:''}:{type:t,url:''});draw()});$('#cancelForm').onclick=closeForm;$('#saveForm').onclick=async()=>{const payload={slug:$('#pslug').value.trim()||$('#pten').value.trim(),title_en:$('#pten').value.trim(),title_ne:$('#ptne').value.trim(),description_en:$('#pden').value,description_ne:$('#pdne').value,sort_order:+$('#psort').value||0,published:$('#ppub').checked,content:blocks};if(!payload.title_en)return alert('Title EN is required');try{await api('/admin/pages',{method:'POST',body:JSON.stringify(payload)});tab('pages')}catch(e){alert(e.message)}}}
async function departments(v){const a=await api('/admin/departments');listForm(v,'Departments',a.map(d=>`<div class="item"><div><b>${esc(d.icon||'')} ${esc(d.name_en)}</b><small>${esc(d.name_ne||'')} · ${esc(d.email||'')}</small></div><div class="row"><button class="btn" data-edit="${d.id}">Edit</button><button class="btn danger" data-del="${d.id}">Delete</button></div></div>`).join(''),d=>deptForm(d));$$('[data-edit]',v).forEach(b=>b.onclick=()=>deptForm(a.find(x=>x.id==b.dataset.edit)));$$('[data-del]',v).forEach(b=>b.onclick=async()=>{if(confirm('Delete department?'))try{await api('/admin/departments/'+b.dataset.del,{method:'DELETE'});tab('departments')}catch(e){alert(e.message)}})}
function deptForm(d){showForm('#listView',`<h3>${d?'Edit':'Add'} department</h3><div class="grid2">${[['Name EN','den',d?.name_en],['Name NE','dne',d?.name_ne],['URL','du',d?.url],['Icon','di',d?.icon],['Email','dem',d?.email],['Image URL','dim',d?.image],['Sort','ds',d?.sort_order??0]].map(([l,id,val])=>`<div><label>${l}</label><input id="${id}" value="${esc(val||'')}"></div>`).join('')}</div><label>Description EN</label><textarea id="dde">${esc(d?.description_en||'')}</textarea><label>Description NE</label><textarea id="ddn">${esc(d?.description_ne||'')}</textarea><label><input type="checkbox" id="dv" ${d?.visible!==0?'checked':''}> Visible</label>${actions()}`);$('#cancelForm').onclick=closeForm;$('#saveForm').onclick=async()=>{try{await api('/admin/departments',{method:'POST',body:JSON.stringify({id:d?.id,name_en:$('#den').value.trim(),name_ne:$('#dne').value,description_en:$('#dde').value,description_ne:$('#ddn').value,url:$('#du').value||'#',icon:$('#di').value,email:$('#dem').value,image:$('#dim').value,sort_order:+$('#ds').value||0,visible:$('#dv').checked})});tab('departments')}catch(e){alert(e.message)}}}
async function messages(v){const a=await api('/admin/messages');v.innerHTML=`<div class="box"><h3>Inbox</h3>${a.map(m=>`<div class="item"><div style="flex:1"><b>${esc(m.name)}</b> &lt;${esc(m.email)}&gt; <span class="badge">${esc(m.status)}</span><small>${esc(m.department_name||'General')} · ${esc(m.created_at||'')}</small><p><b>${esc(m.subject||'(no subject)')}</b></p><div style="white-space:pre-wrap">${esc(m.body)}</div><button class="btn gold" data-reply-open="${m.id}">Reply</button><div class="hidden form-panel" id="reply-${m.id}"><label>Reply message</label><textarea id="replytext-${m.id}" rows="4"></textarea><div class="row"><button class="btn gold" data-send="${m.id}">Send reply</button><button class="btn" data-close="${m.id}">Cancel</button></div></div></div><div class="row"><button class="btn" data-read="${m.id}">Mark read</button><button class="btn danger" data-del="${m.id}">Delete</button></div></div>`).join('')||'<p class="muted">No messages.</p>'}</div>`;$$('[data-reply-open]').forEach(b=>b.onclick=()=>$('#reply-'+b.dataset.replyOpen).classList.remove('hidden'));$$('[data-close]').forEach(b=>b.onclick=()=>$('#reply-'+b.dataset.close).classList.add('hidden'));$$('[data-send]').forEach(b=>b.onclick=async()=>{const replyText=$('#replytext-'+b.dataset.send).value.trim();if(!replyText)return alert('Write a reply first');if(!confirm('Send reply by email?'))return;try{b.disabled=true;await api('/admin/messages/'+b.dataset.send,{method:'POST',body:JSON.stringify({replyText})});alert('Reply sent');tab('messages')}catch(e){b.disabled=false;alert(e.message)}});$$('[data-read]').forEach(b=>b.onclick=async()=>{try{await api('/admin/messages/'+b.dataset.read,{method:'POST',body:JSON.stringify({status:'read'})});tab('messages')}catch(e){alert(e.message)}});$$('[data-del]').forEach(b=>b.onclick=async()=>{if(confirm('Delete message?'))try{await api('/admin/messages/'+b.dataset.del,{method:'DELETE'});tab('messages')}catch(e){alert(e.message)}})}
async function menus(v){const a=await api('/admin/menus');listForm(v,'Menus',a.map(m=>`<div class="item"><div><b>${esc(m.label_en)}</b><small>${esc(m.label_ne)} → ${esc(m.url)}</small></div><div class="row"><button class="btn" data-edit="${m.id}">Edit</button><button class="btn danger" data-del="${m.id}">Delete</button></div></div>`).join(''),m=>menuForm(m));$$('[data-edit]',v).forEach(b=>b.onclick=()=>menuForm(a.find(x=>x.id==b.dataset.edit)));$$('[data-del]',v).forEach(b=>b.onclick=async()=>{if(confirm('Delete menu?'))try{await api('/admin/menus/'+b.dataset.del,{method:'DELETE'});tab('menus')}catch(e){alert(e.message)}})}
function menuForm(m){showForm('#listView',`<h3>${m?'Edit':'Add'} menu</h3><label>Label EN</label><input id="men" value="${esc(m?.label_en||'')}"><label>Label NE</label><input id="mne" value="${esc(m?.label_ne||'')}"><label>URL</label><input id="mu" value="${esc(m?.url||'')}"><label>Sort</label><input id="ms" type="number" value="${m?.sort_order??0}"><label><input id="mv" type="checkbox" ${m?.visible!==0?'checked':''}> Visible</label>${actions()}`);$('#cancelForm').onclick=closeForm;$('#saveForm').onclick=async()=>{try{await api('/admin/menus',{method:'POST',body:JSON.stringify({id:m?.id,label_en:$('#men').value,label_ne:$('#mne').value,url:$('#mu').value,sort_order:+$('#ms').value||0,visible:$('#mv').checked})});tab('menus')}catch(e){alert(e.message)}}}
async function media(v){const a=await api('/admin/media');v.innerHTML=`<div class="box"><h3>Media Library</h3><p class="muted">Upload limit 25 MB. Uploading media does not automatically place it on a page.</p><div class="row"><input id="mediaFile" type="file"><button class="btn gold" id="uploadMedia">Upload</button></div><input id="mediaSearch" placeholder="Search files…"><div id="mediaList"></div></div>`;const draw=()=>{$('#mediaList').innerHTML=a.filter(x=>(x.name||'').toLowerCase().includes($('#mediaSearch').value.toLowerCase())).map(x=>`<div class="item"><div>${esc(x.name)}<small>${esc(x.url)} · ${Math.round((x.size||0)/1024)} KB</small></div><div class="row"><button class="btn" data-copy="${esc(x.url)}">Copy URL</button><button class="btn danger" data-del="${esc(x.key)}">Delete</button></div></div>`).join('')||'<p class="muted">No media files.</p>';$$('[data-copy]').forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.copy);alert('Copied')}catch{prompt('Copy URL',b.dataset.copy)}});$$('[data-del]').forEach(b=>b.onclick=async()=>{if(confirm('Delete this media file?'))try{await api('/admin/media/'+encodeURIComponent(b.dataset.del),{method:'DELETE'});tab('media')}catch(e){alert(e.message)}})};draw();$('#mediaSearch').oninput=draw;$('#uploadMedia').onclick=async()=>{const f=$('#mediaFile').files[0];if(!f)return alert('Choose a file');if(f.size>25*1024*1024)return alert('Maximum 25 MB');try{const r=await fetch('/api/admin/media/upload',{method:'POST',headers:{'content-type':f.type||'application/octet-stream','x-file-name':encodeURIComponent(f.name)},body:f});const d=await r.json();if(!r.ok)throw Error(d.error||'Upload failed');tab('media')}catch(e){alert(e.message)}}}
async function products(v){const a=await api('/admin/products'),c=await api('/admin/categories').catch(()=>[]);listForm(v,'Marketplace Products',a.map(p=>`<div class="item"><div><b>${esc(p.name_en)}</b><small>/${esc(p.slug)} · ${p.price} ${esc(p.currency||'NPR')} · ${esc(p.status)}</small></div><div class="row"><button class="btn" data-edit="${p.id}">Edit</button><button class="btn danger" data-del="${p.id}">Delete</button></div></div>`).join(''),p=>productForm(p,c),'+ Product');$$('[data-edit]',v).forEach(b=>b.onclick=()=>productForm(a.find(x=>x.id==b.dataset.edit),c));$$('[data-del]',v).forEach(b=>b.onclick=async()=>{if(confirm('Delete product?'))try{await api('/admin/products/'+b.dataset.del,{method:'DELETE'});tab('products')}catch(e){alert(e.message)}})}
function productForm(p,c){showForm('#listView',`<h3>${p?'Edit':'Add'} product</h3><div class="grid2">${[['Name EN','pen',p?.name_en],['Name NE','pne',p?.name_ne],['Slug','psl',p?.slug],['Price','ppr',p?.price??0],['Compare price','pcp',p?.compare_price??''],['Currency','pcu',p?.currency||'NPR'],['Stock','pst',p?.stock??0],['SKU','psk',p?.sku],['Image URL','pim',p?.image],['Sort','pso',p?.sort_order??0]].map(([l,id,val])=>`<div><label>${l}</label><input id="${id}" value="${esc(val??'')}"></div>`).join('')}<div><label>Category</label><select id="pcat"><option value="">—</option>${c.map(x=>`<option value="${x.id}" ${p?.category_id==x.id?'selected':''}>${esc(x.name_en)}</option>`).join('')}</select></div><div><label>Status</label><select id="pstatus"><option value="draft" ${p?.status==='draft'?'selected':''}>Draft</option><option value="published" ${p?.status==='published'?'selected':''}>Published</option></select></div></div><label>Description EN</label><textarea id="pde">${esc(p?.description_en||'')}</textarea><label>Description NE</label><textarea id="pdn">${esc(p?.description_ne||'')}</textarea><label><input id="pfeat" type="checkbox" ${p?.featured?'checked':''}> Featured</label>${actions()}`);$('#cancelForm').onclick=closeForm;$('#saveForm').onclick=async()=>{try{await api('/admin/products',{method:'POST',body:JSON.stringify({id:p?.id,name_en:$('#pen').value,name_ne:$('#pne').value,slug:$('#psl').value,price:+$('#ppr').value||0,compare_price:$('#pcp').value===''?null:+$('#pcp').value,currency:$('#pcu').value,stock:+$('#pst').value||0,sku:$('#psk').value,image:$('#pim').value,sort_order:+$('#pso').value||0,category_id:$('#pcat').value?+$('#pcat').value:null,status:$('#pstatus').value,description_en:$('#pde').value,description_ne:$('#pdn').value,featured:$('#pfeat').checked})});tab('products')}catch(e){alert(e.message)}}}
async function categories(v){const a=await api('/admin/categories');listForm(v,'Marketplace Categories',a.map(c=>`<div class="item"><div><b>${esc(c.name_en)}</b><small>/${esc(c.slug)}</small></div><div class="row"><button class="btn" data-edit="${c.id}">Edit</button><button class="btn danger" data-del="${c.id}">Delete</button></div></div>`).join(''),c=>categoryForm(c));$$('[data-edit]',v).forEach(b=>b.onclick=()=>categoryForm(a.find(x=>x.id==b.dataset.edit)));$$('[data-del]',v).forEach(b=>b.onclick=async()=>{if(confirm('Delete category?'))try{await api('/admin/categories/'+b.dataset.del,{method:'DELETE'});tab('categories')}catch(e){alert(e.message)}})}
function categoryForm(c){showForm('#listView',`<h3>${c?'Edit':'Add'} marketplace category</h3><label>Name EN</label><input id="cen" value="${esc(c?.name_en||'')}"><label>Name NE</label><input id="cne" value="${esc(c?.name_ne||'')}"><label>Slug</label><input id="csl" value="${esc(c?.slug||'')}"><label>Image URL</label><input id="cim" value="${esc(c?.image||'')}"><label>Description EN</label><textarea id="cde">${esc(c?.description_en||'')}</textarea><label><input id="cv" type="checkbox" ${c?.visible!==0?'checked':''}> Visible</label>${actions()}`);$('#cancelForm').onclick=closeForm;$('#saveForm').onclick=async()=>{try{await api('/admin/categories',{method:'POST',body:JSON.stringify({id:c?.id,name_en:$('#cen').value,name_ne:$('#cne').value,slug:$('#csl').value,image:$('#cim').value,description_en:$('#cde').value,visible:$('#cv').checked})});tab('categories')}catch(e){alert(e.message)}}}
async function orders(v){const a=await api('/admin/orders');v.innerHTML=`<div class="box"><h3>Orders</h3>${a.map(o=>`<div class="item"><div><b>#${esc(o.order_number)}</b> — ${esc(o.customer_name)}<small>${esc(o.customer_email)} · ${o.total} ${esc(o.currency)} · ${esc(o.status)}</small></div><button class="btn" data-paid="${o.id}">Mark paid</button></div>`).join('')||'<p class="muted">No orders yet.</p>'}</div>`;$$('[data-paid]').forEach(b=>b.onclick=async()=>{try{await api('/admin/orders/'+b.dataset.paid,{method:'POST',body:JSON.stringify({status:'paid'})});tab('orders')}catch(e){alert(e.message)}})}
async function settings(v){const d=await api('/admin/overview'),s=d.settings||{};v.innerHTML=`<div class="box"><h3>Site settings</h3><div class="grid2">${[['Brand name','brand_name'],['Tagline','tagline'],['Contact email','contact_email'],['Hero image URL','hero_image'],['Hero title EN','hero_title_en'],['Hero title NE','hero_title_ne'],['Primary color','primary_color'],['Accent color','accent_color'],['Footer text','footer_text'],['Currency','currency']].map(([l,k])=>`<div><label>${l}</label><input data-setting="${k}" value="${esc(s[k]||'')}"></div>`).join('')}</div><label>Hero description EN</label><textarea data-setting="hero_desc_en">${esc(s.hero_desc_en||'')}</textarea><label>Hero description NE</label><textarea data-setting="hero_desc_ne">${esc(s.hero_desc_ne||'')}</textarea><label><input type="checkbox" id="marketEnabled" ${s.marketplace_enabled==='1'?'checked':''}> Marketplace enabled</label><button class="btn gold" id="saveSettings">Save settings</button></div>`;$('#saveSettings').onclick=async()=>{const data={};$$('[data-setting]').forEach(x=>data[x.dataset.setting]=x.value);data.marketplace_enabled=$('#marketEnabled').checked?'1':'0';try{await api('/admin/settings',{method:'POST',body:JSON.stringify(data)});alert('Settings saved')}catch(e){alert(e.message)}}}
function security(v){v.innerHTML=`<div class="box"><h3>Change password</h3><label>Current password</label><input id="oldp" type="password"><label>New password (12+ characters)</label><input id="newp" type="password"><button class="btn gold" id="changePass">Change password</button></div>`;$('#changePass').onclick=async()=>{try{await api('/admin/password',{method:'POST',body:JSON.stringify({currentPassword:$('#oldp').value,newPassword:$('#newp').value})});alert('Password changed')}catch(e){alert(e.message)}}}
boot();
</script>
</body></html>
