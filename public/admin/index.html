<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Granshi Admin</title>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f0f2f7;color:#182338;font-family:system-ui,Arial}
.hidden{display:none!important}
.login{max-width:420px;margin:8vh auto;background:#fff;padding:28px;border-radius:18px;box-shadow:0 15px 50px #16243b18}
input,textarea,select{width:100%;padding:11px 12px;border:1px solid #dfe4ec;border-radius:9px;margin:5px 0 12px;font:inherit}
.btn{background:#172640;color:#fff;border:0;border-radius:9px;padding:10px 14px;font-weight:750;cursor:pointer;font-size:13px}
.gold{background:#d8b46a;color:#182338}.danger{background:#a83333}.muted{color:#68758a;font-size:13px}
.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.side{background:#101a2c;color:#fff;padding:16px 10px;position:sticky;top:0;height:100vh;overflow:auto}
.side h2{padding:4px 10px 12px;font-size:16px;margin:0}
.side button{display:block;width:100%;text-align:left;background:none;color:#dce3ed;border:0;padding:10px;border-radius:8px;cursor:pointer;font:inherit}
.side button.active,.side button:hover{background:#ffffff18;color:#f1d99e}
.main{padding:20px;min-width:0}
.box{background:#fff;border:1px solid #e4e8ef;border-radius:14px;padding:16px 18px;margin-top:12px}
.item{padding:12px;border:1px solid #e5e9ef;border-radius:10px;margin:8px 0;display:flex;justify-content:space-between;gap:10px;align-items:flex-start;background:#fafbfd}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700}
.badge.new{background:#e8f0fe;color:#1a56db}.badge.replied{background:#e8f5e9;color:#2e7d32}
.badge.published{background:#e8f5e9;color:#2e7d32}.badge.draft{background:#f3f4f6;color:#6b7280}
.notice{background:#fff5df;padding:10px 12px;border-radius:10px;color:#775820;font-size:13px;margin:8px 0}
.reply-box{display:none;margin-top:10px;padding:12px;background:#f7f8fb;border-radius:10px;border:1px solid #e5e9ef}
.reply-box.open{display:block}
.builder{display:grid;grid-template-columns:1fr 240px;gap:14px;margin-top:12px}
.canvas{min-height:160px;background:#f7f8fb;border:2px dashed #d0d7e4;border-radius:12px;padding:10px}
.block{background:#fff;border:1px solid #dfe4ec;border-radius:10px;padding:10px;margin:8px 0;position:relative}
.block .handle{position:absolute;left:6px;top:8px;color:#9aa3b2;cursor:grab}
.block .rm{position:absolute;right:6px;top:6px;border:0;background:#f3f4f6;border-radius:6px;padding:3px 7px;cursor:pointer}
.block .body{margin:0 28px 0 20px}
.palette button{display:block;width:100%;text-align:left;margin:4px 0;padding:8px 10px;border:1px solid #e5e9ef;border-radius:8px;background:#fafbfd;cursor:pointer;font-size:13px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.tabs button{background:#eef1f6;border:0;padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:600}
.tabs button.on{background:#172640;color:#fff}
@media(max-width:900px){.shell{grid-template-columns:1fr}.side{height:auto;position:relative;display:flex;overflow:auto;gap:4px}.side h2{display:none}.side button{width:auto;white-space:nowrap}.builder{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="login" class="login">
  <h1>GRANSHI ADMIN</h1>
  <p class="muted">Department-centric control panel</p>
  <div id="setupNote" class="notice hidden">First run: need SETUP_TOKEN secret.</div>
  <label>Email</label><input id="email" type="email">
  <label>Password</label><input id="password" type="password">
  <div id="setupTokenField" class="hidden"><label>Setup Token</label><input id="setupToken" type="password"></div>
  <button class="btn gold" id="loginBtn">Log in</button>
  <p class="muted" id="loginStatus"></p>
</div>

<div id="app" class="shell hidden">
  <aside class="side">
    <h2>GRANSHI</h2>
    <button data-tab="overview" class="active">Overview</button>
    <button data-tab="departments">Departments</button>
    <button data-tab="messages">Messages</button>
    <button data-tab="comments">Comments</button>
    <button data-tab="menus">Menus</button>
    <button data-tab="usefulLinks">Useful Links</button>
    <button data-tab="settings">Settings</button>
    <button data-tab="security">Security</button>
    <button id="logout" style="margin-top:16px;color:#f5a8a8">Log out</button>
  </aside>
  <main class="main">
    <h1 id="tabTitle" style="margin:0 0 8px;font-size:20px">Overview</h1>
    <div id="view"></div>
  </main>
</div>

<script>
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>[...el.querySelectorAll(s)];
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function api(path,opts={}){
  const r=await fetch('/api'+path,{...opts,headers:{'content-type':'application/json',...(opts.headers||{})}});
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.error||d.detail||'Request failed');
  return d;
}
async function boot(){
  try{const st=await api('/setup/status');if(!st.initialized){$('#setupNote').classList.remove('hidden');$('#setupTokenField').classList.remove('hidden');$('#loginBtn').textContent='Create admin'}}catch(_){}
  try{const me=await api('/auth/me');showApp(me.email)}catch{$('#login').classList.remove('hidden')}
}
$('#loginBtn').onclick=async()=>{
  $('#loginStatus').textContent='Working…';
  try{
    if(!$('#setupTokenField').classList.contains('hidden'))
      await api('/setup',{method:'POST',body:JSON.stringify({email:$('#email').value.trim(),password:$('#password').value,setupToken:$('#setupToken').value})});
    else
      await api('/auth/login',{method:'POST',body:JSON.stringify({email:$('#email').value.trim(),password:$('#password').value})});
    showApp($('#email').value.trim());
  }catch(e){$('#loginStatus').textContent=e.message}
};
$('#logout').onclick=async()=>{await api('/auth/logout',{method:'POST'});location.reload()};
function showApp(email){
  $('#login').classList.add('hidden');$('#app').classList.remove('hidden');
  $$('.side button[data-tab]').forEach(b=>b.onclick=()=>{$$('.side button[data-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active');tab(b.dataset.tab)});
  tab('overview');
}
const titles={overview:'Overview',departments:'Departments & content',messages:'Messages',comments:'Comments / Feedback',menus:'Menus',usefulLinks:'Useful Links',settings:'Settings',security:'Security'};
async function tab(name){
  $('#tabTitle').textContent=titles[name]||name;
  const v=$('#view');v.innerHTML='<div class="box"><p class="muted">Loading…</p></div>';
  try{
    if(name==='overview'){
      const d=await api('/admin/overview');
      v.innerHTML=`<div class="box"><p>Logged in. New messages: <b>${d.new_messages||0}</b> · Departments: <b>${(d.departments||[]).length}</b> · Published pages: <b>${(d.pages||[]).length}</b></p>
        <p class="notice">Open <b>Departments</b> to manage pages, categories and media inside each department.</p></div>`;
    }
    if(name==='departments') await renderDepartments(v);
    if(name==='messages') await renderMessages(v);
    if(name==='comments') await renderComments(v);
    if(name==='menus') await renderMenus(v);
    if(name==='usefulLinks') await renderUsefulLinks(v);
    if(name==='settings') await renderSettings(v);
    if(name==='security'){
      v.innerHTML=`<div class="box"><h3>Change password</h3>
        <label>Current</label><input id="oldp" type="password">
        <label>New (12+)</label><input id="newp" type="password">
        <button class="btn gold" id="chp">Change</button></div>`;
      $('#chp').onclick=async()=>{try{await api('/admin/password',{method:'POST',body:JSON.stringify({currentPassword:$('#oldp').value,newPassword:$('#newp').value})});alert('Changed')}catch(e){alert(e.message)}};
    }
  }catch(e){v.innerHTML=`<div class="box">Error: ${esc(e.message)}</div>`}
}


/* ---- Footer useful links ---- */
async function renderUsefulLinks(v){
  const cfg=await api('/admin/overview');
  let links=[];
  try{links=JSON.parse(cfg.settings?.useful_links||'[]');if(!Array.isArray(links))links=[]}catch{links=[]}
  function draw(){
    v.innerHTML=`<div class="box">
      <div class="row" style="justify-content:space-between"><h3>Footer · Useful Links</h3><button class="btn gold" id="ulAdd">+ Add link</button></div>
      <p class="muted">यहाँ थपिएका लिंकहरू वेबसाइटको footer मा देखिन्छन्। Title, छोटो विवरण र पूरा URL राख्नुहोस्।</p>
      <div id="ulRows">${links.map((x,i)=>`
        <div class="box" style="background:#f8f9fc">
          <div class="row" style="justify-content:space-between"><b>Link ${i+1}</b><button class="btn danger" data-uldel="${i}">Remove</button></div>
          <label>Title / नाम</label><input data-ultitle="${i}" value="${esc(x.title||'')}" placeholder="Example: Nepal Government">
          <label>Short description / छोटो विवरण</label><input data-uldesc="${i}" value="${esc(x.description||'')}" placeholder="Official information and services">
          <label>URL (https://...)</label><input data-ulurl="${i}" type="url" value="${esc(x.url||'')}" placeholder="https://example.com">
          <div class="row"><button class="btn" data-ulup="${i}" ${i===0?'disabled':''}>↑ Move</button><button class="btn" data-uldn="${i}" ${i===links.length-1?'disabled':''}>↓ Move</button></div>
        </div>`).join('')||'<p class="muted">अहिलेसम्म Useful Links थपिएको छैन।</p>'}</div>
      <button class="btn gold" id="ulSave">Save Useful Links</button><span id="ulStatus" class="muted" style="margin-left:10px"></span>
    </div>`;
    $('[data-ultitle]').forEach(el=>el.oninput=()=>links[+el.dataset.ultitle].title=el.value);
    $('[data-uldesc]').forEach(el=>el.oninput=()=>links[+el.dataset.uldesc].description=el.value);
    $('[data-ulurl]').forEach(el=>el.oninput=()=>links[+el.dataset.ulurl].url=el.value);
    $('[data-uldel]').forEach(el=>el.onclick=()=>{links.splice(+el.dataset.uldel,1);draw()});
    $('[data-ulup]').forEach(el=>el.onclick=()=>{const i=+el.dataset.ulup;[links[i-1],links[i]]=[links[i],links[i-1]];draw()});
    $('[data-uldn]').forEach(el=>el.onclick=()=>{const i=+el.dataset.uldn;[links[i+1],links[i]]=[links[i],links[i+1]];draw()});
    $('#ulAdd').onclick=()=>{links.push({title:'',description:'',url:''});draw()};
    $('#ulSave').onclick=async()=>{
      const status=$('#ulStatus');
      for(const x of links){if(!x.title.trim()||!x.url.trim()){status.textContent='Each link needs a title and URL.';return}
        try{const u=new URL(x.url);if(!['http:','https:'].includes(u.protocol))throw new Error();}catch{status.textContent='Please enter a valid http/https URL.';return}}
      $('#ulSave').disabled=true;status.textContent='Saving…';
      try{await api('/admin/settings',{method:'POST',body:JSON.stringify({useful_links:JSON.stringify(links)})});status.textContent='Saved successfully.'}
      catch(e){status.textContent=e.message}
      finally{$('#ulSave').disabled=false}
    };
  }
  draw();
}

/* ---- Departments hub ---- */
async function renderDepartments(v){
  const list=await api('/admin/departments');
  v.innerHTML=`<div class="box">
    <div class="row" style="justify-content:space-between;align-items:center;gap:8px">
      <h3 style="margin:0;font-size:16px">Departments</h3>
      <button class="btn gold" id="newDept" style="padding:6px 10px;font-size:12px">+ New</button>
    </div>
    <p class="muted" style="margin:8px 0">Open → Pages / Media। Edit → नाम/slug।</p>
    <div id="deptList">${list.map(d=>`
      <div class="item" style="align-items:center;padding:10px 12px">
        <div style="flex:1;min-width:0"><b style="font-size:14px">${esc(d.icon||'')} ${esc(d.name_en)}</b>
          <div class="muted" style="font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(d.name_ne||'')} · /dept/${esc(d.slug||d.id)}</div>
        </div>
        <div class="row" style="flex-shrink:0;gap:4px">
          <button class="btn gold" style="padding:5px 8px;font-size:11px" data-open="${d.id}">Open</button>
          <button class="btn" style="padding:5px 8px;font-size:11px" data-edit="${d.id}">Edit</button>
          <button class="btn danger" style="padding:5px 8px;font-size:11px" data-del="${d.id}">Del</button>
        </div>
      </div>`).join('')||'<p class="muted">No departments</p>'}
    </div>
    <div id="deptEd" class="hidden"></div>
    <div id="deptHub" class="hidden"></div>
  </div>`;
  $('#newDept').onclick=()=>{ $('#deptList').classList.add('hidden'); $('#deptHub').classList.add('hidden'); editDept(); };
  $$('[data-edit]').forEach(b=>b.onclick=()=>{ $('#deptList').classList.add('hidden'); $('#deptHub').classList.add('hidden'); editDept(list.find(x=>x.id==b.dataset.edit)); });
  $$('[data-del]').forEach(b=>b.onclick=async()=>{
    if(!confirm('यो department मेटाउने हो? यो कार्य उल्ट्याउन मिल्दैन।'))return;
    if(!confirm('Confirm delete?'))return;
    await api('/admin/departments/'+b.dataset.del,{method:'DELETE'});
    tab('departments');
  });
  $$('[data-open]').forEach(b=>b.onclick=()=>openDeptHub(+b.dataset.open));
}
function editDept(d){
  const ed=$('#deptEd');ed.classList.remove('hidden');
  ed.innerHTML=`<h3 style="margin-top:0">${d?'Edit':'New'} department</h3>
    <div class="grid2">
      <div><label>Name EN *</label><input id="d_en" value="${esc(d?.name_en||'')}"></div>
      <div><label>Name NE</label><input id="d_ne" value="${esc(d?.name_ne||'')}"></div>
      <div><label>Slug</label><input id="d_slug" value="${esc(d?.slug||'')}" placeholder="auto from name"></div>
      <div><label>Icon</label><input id="d_icon" value="${esc(d?.icon||'✦')}"></div>
      <div><label>Contact email</label><input id="d_email" value="${esc(d?.email||'')}"></div>
      <div><label>Sort</label><input id="d_sort" type="number" value="${d?.sort_order??0}"></div>
    </div>
    <label>Description EN</label><textarea id="d_den">${esc(d?.description_en||'')}</textarea>
    <label>Description NE</label><textarea id="d_dne">${esc(d?.description_ne||'')}</textarea>
    <label><input type="checkbox" id="d_vis" ${d?.visible!==0?'checked':''}> Visible</label>
    <div class="row" style="margin-top:10px"><button class="btn gold" id="saveD">Save</button><button class="btn" id="canD">Cancel</button></div>`;
  $('#canD').onclick=()=>{ed.classList.add('hidden');$('#deptList').classList.remove('hidden')};
  $('#saveD').onclick=async()=>{
    await api('/admin/departments',{method:'POST',body:JSON.stringify({
      id:d?.id,name_en:$('#d_en').value.trim(),name_ne:$('#d_ne').value.trim(),slug:$('#d_slug').value.trim(),
      icon:$('#d_icon').value.trim(),email:$('#d_email').value.trim(),sort_order:Number($('#d_sort').value||0),
      description_en:$('#d_den').value.trim(),description_ne:$('#d_dne').value.trim(),visible:$('#d_vis').checked
    })});
    tab('departments');
  };
}
async function openDeptHub(id){
  const listEl=$('#deptList');const ed=$('#deptEd');const hub=$('#deptHub');
  if(listEl)listEl.classList.add('hidden');
  if(ed)ed.classList.add('hidden');
  hub.classList.remove('hidden');
  hub.innerHTML='<p class="muted">Loading…</p>';
  try{
    const data=await api('/admin/departments/'+id+'/bundle');
    const dept=data.department;
    let sub='pages';
    function draw(){
      hub.innerHTML=`<div>
        <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:8px">
          <h3 style="margin:0;font-size:16px">${esc(dept.icon||'')} ${esc(dept.name_en)}</h3>
          <button class="btn" id="closeHub" style="padding:5px 10px;font-size:12px">← Back</button>
        </div>
        <div class="tabs">
          <button class="${sub==='pages'?'on':''}" data-s="pages">Pages</button>
          <button class="${sub==='categories'?'on':''}" data-s="categories">Categories</button>
          <button class="${sub==='media'?'on':''}" data-s="media">Media</button>
        </div>
        <div id="subView"></div>
      </div>`;
      $('#closeHub').onclick=()=>{hub.classList.add('hidden');hub.innerHTML='';$('#deptList').classList.remove('hidden')};
      $$('[data-s]').forEach(b=>b.onclick=()=>{sub=b.dataset.s;draw()});
      const sv=$('#subView');
      if(sub==='pages') renderDeptPages(sv,dept,data.pages||[],data.categories||[]);
      if(sub==='categories') renderDeptCats(sv,dept,data.categories||[]);
      if(sub==='media') renderDeptMedia(sv,dept,data.media||[]);
    }
    draw();
  }catch(e){
    hub.innerHTML=`<div class="notice">Open failed: ${esc(e.message)}</div>
      <p class="muted">D1 मा column नभए ALTER चलाउनुहोस् (तलको SQL)।</p>
      <button class="btn" id="closeHub">← Back</button>`;
    $('#closeHub').onclick=()=>{hub.classList.add('hidden');$('#deptList').classList.remove('hidden')};
  }
}
function renderDeptPages(sv,dept,pages,cats){
  sv.innerHTML=`<div class="row" style="justify-content:space-between"><b>Pages in this department</b><button class="btn gold" id="np">+ Page (ZIP)</button></div>
    <p class="notice">मुख्य नियम: बाहिर page ZIP बनाउनुहोस् → यहाँ upload → Preview → Publish। Block editor optional मात्र।</p>
    ${pages.map(p=>{
      const isZip=String(p.template||'').startsWith('zip:');
      return `<div class="item"><div><b>${esc(p.title_en)}</b>
      <small class="muted">/${esc(p.slug)} · ${isZip?'ZIP package':'Blocks'} · <span class="badge ${p.published?'published':'draft'}">${p.published?'Published':'Draft'}</span>
      ${p.is_popular?' · Popular':''}</small></div>
      <div class="row">
        <a class="btn" href="/_preview/${esc(p.slug)}" target="_blank" rel="noopener">Preview</a>
        <button class="btn" data-ep="${esc(p.slug)}">Edit</button>
        <button class="btn danger" data-dp="${esc(p.slug)}">Delete</button>
      </div></div>`;
    }).join('')||'<p class="muted">No pages yet</p>'}
    <div id="pageEd" class="hidden"></div>`;
  $('#np').onclick=()=>openPageEditor(null,dept,cats);
  $$('[data-ep]').forEach(b=>b.onclick=()=>openPageEditor(pages.find(x=>x.slug===b.dataset.ep),dept,cats));
  $$('[data-dp]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete page?'))return;await api('/admin/pages/'+encodeURIComponent(b.dataset.dp),{method:'DELETE'});openDeptHub(dept.id)});
}
function openPageEditor(page,dept,cats){
  const ed=$('#pageEd');ed.classList.remove('hidden');
  const isZipExisting=page && String(page.template||'').startsWith('zip:');
  let fileList=[];
  let zipReady=false;
  ed.innerHTML=`<h4>${page?'Edit':'New'} page</h4>
    <div class="notice"><b>Primary:</b> Upload a ZIP of your finished page (must include <code>index.html</code>). Test offline first, then upload → Preview → Publish.</div>
    <div class="grid2">
      <div><label>Title EN *</label><input id="p_te" value="${esc(page?.title_en||'')}"></div>
      <div><label>Title NE</label><input id="p_tn" value="${esc(page?.title_ne||'')}"></div>
      <div><label>Slug * (URL)</label><input id="p_sl" value="${esc(page?.slug||'')}" ${page?'readonly':''} placeholder="my-article"></div>
      <div><label>Category</label><select id="p_cat"><option value="">—</option>${(cats||[]).map(c=>`<option value="${c.id}" ${page?.category_id==c.id?'selected':''}>${esc(c.name_en)}</option>`).join('')}</select></div>
    </div>
    <label>Description EN</label><textarea id="p_de" rows="2">${esc(page?.description_en||'')}</textarea>
    <label>Description NE</label><textarea id="p_dn" rows="2">${esc(page?.description_ne||'')}</textarea>
    <label><input type="checkbox" id="p_pub" ${page?.published?'checked':''}> Published (live)</label>
    <label><input type="checkbox" id="p_pop" ${page?.is_popular?'checked':''}> Popular on homepage</label>

    <div class="box" style="margin-top:12px;background:#f7f8fb">
      <h4 style="margin-top:0">1) ZIP package upload (main)</h4>
      <p class="muted">ZIP भित्र: index.html + css/js/images। Nested folder OK। Mobile बाट पनि ZIP छान्न मिल्छ।</p>
      <input type="file" id="zipFile" accept=".zip,application/zip">
      <div id="zipStatus" class="muted" style="margin-top:8px">${isZipExisting?'Existing ZIP page — upload new ZIP to replace files.':'No ZIP selected yet.'}</div>
      <ul id="zipList" class="muted" style="font-size:12px;max-height:120px;overflow:auto"></ul>
      <button class="btn gold" type="button" id="uploadZip" style="margin-top:8px">Upload ZIP to server</button>
    </div>

    <div class="row" style="margin-top:14px">
      <button class="btn gold" id="saveP">Save page</button>
      <a class="btn" id="prevP" href="#" target="_blank" rel="noopener">Preview</a>
      <button class="btn" id="canP">Cancel</button>
      <button class="btn" type="button" id="toggleBlocks">Optional: block editor</button>
    </div>

    <div id="blocksWrap" class="hidden" style="margin-top:14px">
      <p class="muted">Optional only — if you are not using ZIP.</p>
      <div class="builder">
        <div><div class="canvas" id="canvas"></div></div>
        <div class="palette">
          <button data-add="heading">Heading</button>
          <button data-add="paragraph">Paragraph</button>
          <button data-add="image">Image</button>
          <button data-add="html">HTML</button>
        </div>
      </div>
    </div>`;

  let blocks=[];
  try{if(page&&!isZipExisting)blocks=typeof page.content==='string'?JSON.parse(page.content):page.content||[]}catch{blocks=[]}
  let useZip=isZipExisting||true; // default zip workflow
  let entryFile='index.html';
  if(isZipExisting) entryFile=String(page.template).slice(4)||'index.html';

  $('#toggleBlocks').onclick=()=>$('#blocksWrap').classList.toggle('hidden');
  $('#canP').onclick=()=>ed.classList.add('hidden');
  $('#prevP').onclick=(e)=>{
    const slug=$('#p_sl').value.trim()||$('#p_te').value.trim();
    if(!slug){e.preventDefault();alert('Save slug first');return}
    $('#prevP').href='/_preview/'+encodeURIComponent(slugifyClient(slug));
  };

  $('#uploadZip').onclick=async()=>{
    const f=$('#zipFile').files[0];
    if(!f)return alert('Choose a .zip file');
    const slug=slugifyClient($('#p_sl').value.trim()||$('#p_te').value.trim());
    if(!slug)return alert('Set Title or slug first');
    $('#p_sl').value=slug;
    const st=$('#zipStatus');
    st.textContent='Reading ZIP…';
    try{
      const zip=await JSZip.loadAsync(f);
      const names=[];
      zip.forEach((path,entry)=>{if(!entry.dir)names.push(path.replace(/\\/g,'/'))});
      // prefer root index.html
      let indexPath=names.find(n=>n==='index.html')||names.find(n=>n.endsWith('/index.html'))||names.find(n=>/\.html?$/i.test(n));
      if(!indexPath)throw new Error('ZIP must contain index.html');
      entryFile=indexPath.includes('/')?indexPath.split('/').pop():indexPath;
      // if files in a single top folder, strip that prefix for R2 keys relative to entry folder
      let prefix='';
      const parts=indexPath.split('/');
      if(parts.length>1){prefix=parts.slice(0,-1).join('/')+'/';entryFile=parts[parts.length-1]}
      fileList=names;
      $('#zipList').innerHTML=names.slice(0,40).map(n=>`<li>${esc(n)}</li>`).join('')+(names.length>40?'<li>…</li>':'');
      st.textContent=`Uploading ${names.length} files…`;
      let done=0;
      for(const path of names){
        const entry=zip.file(path);
        if(!entry)continue;
        let rel=path.replace(/\\/g,'/');
        if(prefix&&rel.startsWith(prefix))rel=rel.slice(prefix.length);
        if(!rel||rel.includes('..'))continue;
        const buf=await entry.async('arraybuffer');
        const ct=guessType(rel);
        const r=await fetch('/api/admin/pages/asset',{
          method:'POST',
          headers:{
            'content-type':ct,
            'x-page-slug':slug,
            'x-department-id':String(dept.id),
            'x-rel-path':encodeURIComponent(rel)
          },
          body:buf
        });
        const d=await r.json();
        if(!r.ok)throw new Error(d.error||'Upload failed: '+rel);
        done++;
        st.textContent=`Uploaded ${done}/${names.length}…`;
      }
      // save page meta as draft zip
      await api('/admin/pages',{method:'POST',body:JSON.stringify({
        slug,title_en:$('#p_te').value.trim()||slug,title_ne:$('#p_tn').value.trim(),
        description_en:$('#p_de').value.trim(),description_ne:$('#p_dn').value.trim(),
        department_id:dept.id,category_id:$('#p_cat').value?Number($('#p_cat').value):null,
        published:false,is_popular:$('#p_pop').checked,
        source_type:'zip',entry_file:entryFile,
        content:{files:names,entry:entryFile}
      })});
      zipReady=true;useZip=true;
      st.textContent=`OK — ${done} files. Now Preview, then check Published and Save.`;
      $('#prevP').href='/_preview/'+encodeURIComponent(slug);
    }catch(e){st.textContent='Error: '+e.message;alert(e.message)}
  };

  // minimal optional blocks
  const canvas=$('#canvas');
  function drawBlocks(){
    if(!canvas)return;
    canvas.innerHTML=blocks.map((b,i)=>`<div class="block"><button class="rm" data-rm="${i}">×</button><div class="body"><b>${esc(b.type)}</b>
      <textarea data-i="${i}" rows="2">${esc(b.text||b.html||b.url||'')}</textarea></div></div>`).join('')||'<p class="muted">No blocks</p>';
    $$('[data-rm]',canvas).forEach(btn=>btn.onclick=()=>{blocks.splice(+btn.dataset.rm,1);drawBlocks()});
    $$('[data-i]',canvas).forEach(el=>el.oninput=()=>{const b=blocks[+el.dataset.i];if(b.type==='html')b.html=el.value;else if(b.type==='image')b.url=el.value;else b.text=el.value});
  }
  drawBlocks();
  $$('[data-add]',ed).forEach(btn=>btn.onclick=()=>{
    const t=btn.dataset.add;
    blocks.push(t==='html'?{type:'html',html:''}:t==='image'?{type:'image',url:''}:{type:t,text:''});
    drawBlocks();
  });

  $('#saveP').onclick=async()=>{
    const slug=slugifyClient($('#p_sl').value.trim()||$('#p_te').value.trim());
    if(!$('#p_te').value.trim())return alert('Title required');
    try{
      const payload={
        slug,title_en:$('#p_te').value.trim(),title_ne:$('#p_tn').value.trim(),
        description_en:$('#p_de').value.trim(),description_ne:$('#p_dn').value.trim(),
        department_id:dept.id,category_id:$('#p_cat').value?Number($('#p_cat').value):null,
        published:$('#p_pub').checked,is_popular:$('#p_pop').checked
      };
      if(useZip||zipReady||isZipExisting){
        payload.source_type='zip';
        payload.entry_file=entryFile||'index.html';
        payload.content={files:fileList,entry:entryFile};
      }else{
        payload.source_type='blocks';
        payload.content=blocks;
      }
      const r=await api('/admin/pages',{method:'POST',body:JSON.stringify(payload)});
      alert('Saved /'+r.slug+(payload.published?' (Published)':' (Draft — use Preview)'));
      openDeptHub(dept.id);
    }catch(e){alert(e.message)}
  };
}
function slugifyClient(s){return String(s||'').toLowerCase().trim().replace(/[^a-z0-9-]+/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'')}
function guessType(name){
  const n=name.toLowerCase();
  if(n.endsWith('.html')||n.endsWith('.htm'))return 'text/html; charset=utf-8';
  if(n.endsWith('.css'))return 'text/css; charset=utf-8';
  if(n.endsWith('.js'))return 'application/javascript; charset=utf-8';
  if(n.endsWith('.json'))return 'application/json';
  if(n.endsWith('.svg'))return 'image/svg+xml';
  if(n.endsWith('.png'))return 'image/png';
  if(n.endsWith('.jpg')||n.endsWith('.jpeg'))return 'image/jpeg';
  if(n.endsWith('.gif'))return 'image/gif';
  if(n.endsWith('.webp'))return 'image/webp';
  if(n.endsWith('.woff2'))return 'font/woff2';
  if(n.endsWith('.woff'))return 'font/woff';
  return 'application/octet-stream';
}

            return `<div style="width:140px;border:1px solid #e5e9ef;border-radius:10px;padding:8px;background:#fff">

              <div class="row" style="margin-top:6px">

        'content-type':f.type||'application/octet-stream','x-page-slug':pg,'x-department-id':String(dept.id),'x-rel-path':encodeURIComponent(rel)
      },body:f});
      const d=await r.json();if(!r.ok)throw new Error(d.error);
      alert('Added: '+d.url);openDeptHub(dept.id);
    }catch(e){alert(e.message)}

    pick.click();

function parseReplyDisplay(raw){
  if(!raw)return {text:'',atts:[]};
  const m=String(raw).match(/\n\n<!--ATTACH:([\s\S]*?)-->$/);
  if(!m)return {text:raw,atts:[]};
  try{return {text:raw.slice(0,m.index),atts:JSON.parse(m[1])}}catch{return {text:raw,atts:[]}}
}

      <div><label>Hero image URL</label><input id="s_h" value="${esc(s.hero_image||'')}"></div>
      <div><label>Hero title EN</label><input id="s_hte" value="${esc(s.hero_title_en||'')}"></div>
      <div><label>Hero title NE</label><input id="s_htn" value="${esc(s.hero_title_ne||'')}"></div>
      <div><label>Primary color</label><input id="s_p" value="${esc(s.primary_color||'#101a2c')}"></div>
      <div><label>Accent color</label><input id="s_a" value="${esc(s.accent_color||'#e5c77e')}"></div>
    </div>
    <label>Hero desc EN</label><textarea id="s_hde">${esc(s.hero_desc_en||'')}</textarea>
    <label>Hero desc NE</label><textarea id="s_hdn">${esc(s.hero_desc_ne||'')}</textarea>
    <label>About EN</label><textarea id="s_ae">${esc(s.about_en||'')}</textarea>
    <label>About NE</label><textarea id="s_an">${esc(s.about_ne||'')}</textarea>
    <label>Footer</label><input id="s_f" value="${esc(s.footer_text||'')}">
    <label style="display:block;margin-top:12px"><input type="checkbox" id="s_comments" ${s.comments_enabled==='0'?'':'checked'}> Enable page comments / feedback</label>
    <button class="btn gold" id="ss" style="margin-top:10px">Save</button></div>`;
  $('#ss').onclick=async()=>{
    await api('/admin/settings',{method:'POST',body:JSON.stringify({
      brand_name:$('#s_b').value,tagline:$('#s_t').value,contact_email:$('#s_m').value,hero_image:$('#s_h').value,
      hero_title_en:$('#s_hte').value,hero_title_ne:$('#s_htn').value,hero_desc_en:$('#s_hde').value,hero_desc_ne:$('#s_hdn').value,
      primary_color:$('#s_p').value,accent_color:$('#s_a').value,about_en:$('#s_ae').value,about_ne:$('#s_an').value,footer_text:$('#s_f').value,
      comments_enabled:$('#s_comments').checked?'1':'0'
    })});
    alert('Saved');
  };
}
boot();
</script>
</body>
</html>
