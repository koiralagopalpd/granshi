name = "granshi"
main = "src/worker.js"
compatibility_date = "2026-11-05"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/media/*"]

[[d1_databases]]
binding = "DB"
database_name = "granshi-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "database"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "granshi-media"

[vars]
ENVIRONMENT = "production"
# Secrets (wrangler secret put):
# SESSION_SECRET
# SETUP_TOKEN
# RESEND_API_KEY  (optional – real email)
