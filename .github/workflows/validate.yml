name: Validate Granshi
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Worker JavaScript
        run: node --check src/worker.js
      - name: Check inline browser scripts
        run: |
          python - <<'PY'
          import re, pathlib, subprocess
          for file in [pathlib.Path("public/index.html"), pathlib.Path("public/admin/index.html")]:
              html=file.read_text()
              for i, script in enumerate(re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script>", html, re.I)):
                  if script.strip():
                      out=pathlib.Path("/tmp") / f"{file.stem}-{i}.js"
                      out.write_text(script)
                      subprocess.run(["node","--check",str(out)],check=True)
          PY
      - name: Apply every migration to a fresh SQLite database
        run: |
          python - <<'PY'
          import sqlite3, pathlib
          root=pathlib.Path("database")
          db=sqlite3.connect(":memory:")
          for n in sorted(root.glob("*.sql")):
              db.executescript(n.read_text())
          tables={r[0] for r in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          assert {"admins","messages","inbound_email_events","page_search_index","admin_message_reads","diagnostics_state","pending_work_items","admin_security_events"} <= tables
          admin_cols={r[1] for r in db.execute("PRAGMA table_info(admins)")}
          assert {"failed_login_attempts","locked_at","session_version","recovery_authorized"} <= admin_cols
          assert "lease_until" in {r[1] for r in db.execute("PRAGMA table_info(diagnostics_state)")}
          page_cols={r[1] for r in db.execute("PRAGMA table_info(pages)")}
          assert {"thumbnail_image","thumbnail_title_en","thumbnail_summary_en","thumbnail_focal_x","thumbnail_focal_y"} <= page_cols
          print("Fresh database: all migrations passed.")
          PY
      - name: Upgrade an existing database without losing data
        run: |
          python - <<'PY'
          import sqlite3, pathlib
          root=pathlib.Path("database")
          db=sqlite3.connect(":memory:")
          for n in range(1,5):
              f=next(root.glob(f"{n:04d}_*.sql"))
              db.executescript(f.read_text())
          db.execute("INSERT INTO pages(slug,title_en,content,updated_at,published) VALUES('keep-me','Existing page','[]','2026-11-15',1)")
          db.execute("INSERT INTO messages(name,email,body,status,created_at,reply_text,replied_at) VALUES('Existing','keep@example.com','Keep this','new','2026-11-15',NULL,NULL)")
          before=(db.execute("SELECT COUNT(*) FROM departments").fetchone()[0],db.execute("SELECT COUNT(*) FROM menus").fetchone()[0])
          for n in range(5,10):
              f=next(root.glob(f"{n:04d}_*.sql"))
              db.executescript(f.read_text())
          assert db.execute("SELECT title_en FROM pages WHERE slug='keep-me'").fetchone()[0]=="Existing page"
          assert db.execute("SELECT body FROM messages WHERE email='keep@example.com'").fetchone()[0]=="Keep this"
          assert before==(db.execute("SELECT COUNT(*) FROM departments").fetchone()[0],db.execute("SELECT COUNT(*) FROM menus").fetchone()[0])
          assert db.execute("SELECT COUNT(*) FROM pending_work_items WHERE title LIKE 'Resend API Key%'").fetchone()[0] == 1
          assert "admin_security_events" in {r[0] for r in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          print("Upgrade test: existing records retained; migrations 0005-0009 applied.")
          PY
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit npm dependencies when lockfile exists
        run: |
          if [ -f package-lock.json ]; then npm ci && npm audit --audit-level=high; else echo "No npm lockfile; no npm dependency tree to audit."; fi
